# Project and organization keys are supplied by the GitHub Actions variables.
sonar.projectName=MrMap
sonar.sourceEncoding=UTF-8
sonar.sources=backend,frontend/src
sonar.tests=backend/tests,frontend/src,frontend/tests
sonar.exclusions=backend/tests/**,backend/coverage/**,**/migrations/**,**/fixtures/**,**/static/**,**/templates/**,backend/locale/**,frontend/src/**/*.spec.*,frontend/src/**/tests/**,**/*.d.ts,**/AGENTS.md,docker/inspire-validator/**
sonar.test.inclusions=backend/tests/**,frontend/src/**/*.spec.*,frontend/src/**/tests/**,frontend/tests/**
# sonar.exclusions only reaches main code; files that sonar.test.inclusions
# classifies as test code are governed by sonar.test.exclusions alone. Keep
# the mirror of the test inclusions here, or the test files get analysed for
# issues after all: the #1383 finding set carried 18 smells in "excluded"
# spec files and backend/tests despite the matching sonar.exclusions entries.
sonar.test.exclusions=**/fixtures/**,backend/tests/**,frontend/src/**/*.spec.*,frontend/src/**/tests/**,frontend/tests/**

# Exclude test suites and colocated specs from duplication metrics.
# The two language files of a translation pair carry the same key structure on
# purpose - CPD reads that parallelism as duplication between en.ts and de.ts,
# while a translation is data that must mirror its counterpart (#1085).
sonar.cpd.exclusions=**/tests/**,**/__tests__/**,**/*.spec.*,**/*.test.*,frontend/src/i18n/**

# Match the runtime and coverage scope already used by the test services.
sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.coverage.exclusions=backend/manage.py
