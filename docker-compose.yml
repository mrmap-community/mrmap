# docker compose file for productive useage

x-proxy-env: &proxy-env
  http_proxy:
  https_proxy:
  HTTP_PROXY:
  HTTPS_PROXY:
  no_proxy: ${no_proxy:-localhost},backend,celery-worker,flower,pgadmin,docker-api,grafana,victoria-logs,victoria-metrics,victoria-traces
  NO_PROXY: ${NO_PROXY:-localhost},backend,celery-worker,flower,pgadmin,docker-api,grafana,victoria-logs,victoria-metrics,victoria-traces

services:

  postgis:
    image: postgis/postgis:18-3.6-alpine
    # Every service in this file declares the same restart policy (#901): after
    # a host reboot the docker engine brings the whole stack back and the
    # backend's readiness wait plus the healthcheck-gated depends_on converge
    # it by themselves. `unless-stopped` and not `always`, so an operator's
    # deliberate `docker compose stop`/`down` survives a reboot too; `docker
    # compose run` one-offs never inherit a service restart policy (verified
    # against Compose v5), so test/check one-offs never come back on boot.
    restart: unless-stopped
    # Disable Postgres JIT for the reference deployment (#871). The annotated
    # service-list query carries dozens of correlated SubPlans and its planner
    # cost (~700k at a realistic dataset, ~110k already with a few 10k records)
    # is above the default jit_above_cost = 100000, so the stock image re-JIT-
    # compiles it on *every* request: a ~360 ms compile over a ~360 ms query
    # (EXPLAIN ANALYZE: Execution 721 -> 363 ms, the JIT: block disappears).
    # These are one-shot OLTP queries whose plan is never reused, so JIT has no
    # chance to amortize. Nothing else in mrmap triggers JIT: the heavy reads
    # (harvest day statistics, tsvector search) cost a few thousand, far below
    # jit_above_cost, so jit=off never removes a JIT speed-up they could use.
    # A raised jit_above_cost would be brittle - the list query's cost grows
    # with the dataset, so it would cross any fixed value again. Set on the
    # server process (not ALTER SYSTEM, which would persist into the shared
    # data volume and leak into test databases); applies to every database.
    command: ["postgres", "-c", "jit=off"]
    # ship container stdout/stderr (postgres stderr log) into victoria-logs
    logging:
      driver: syslog
      options:
        syslog-address: "udp://127.0.0.1:5514"
        syslog-format: "rfc5424"
        syslog-facility: "local5"
        tag: "{{.Name}}"
    volumes:
      - type: volume
        source: db-data-18
        target: /var/lib/postgresql
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: 134217728 # 128*2^20 bytes = 128Mb
    networks:
      - mrmap-internal
    environment:
      POSTGRES_USER: "${DB_USER:?Please configure DB_USER in the .env file}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Please configure DB_PASSWORD in the .env file}"
      POSTGRES_DB: "${POSTGRES_DB:-mrmap}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
  # migration guide:
  # 1. backup current db => docker exec -it `container_id` pg_dumpall -U mrmap  > .upgrade_backup.sql
  # 2. call pg_extract script => backend/.bash_scripts/pg_extract.sh .upgrade_backup.sql mrmap >> upgrade_backup_mydb.sql
  # 3. change image definition to higher postgis; change volume source to new location; start container => docker compose up postgis --build
  # 4. cat upgrade_backup_mydb.sql | docker exec -i `container_id` psql -U mrmap
  # Done

  redis:
    image: library/redis:8.12.0-alpine
    restart: unless-stopped
    # #1618: the eviction policy comes from docker/redis/redis.conf (see there
    # for why volatile-lru is the policy which cannot drop broker keys); the
    # maxmemory is the deployment's number and overridable per .env. The
    # command-line form outranks the config file, so this is THE bound.
    # #1473: the same channel carries `--requirepass`. It cannot live in the
    # committed redis.conf - redis expands no variable inside a config file,
    # and a committed file is no place for a secret - so it is a CLI argument
    # from the deployment's .env, and `:?` makes an unset value fail the way
    # DB_PASSWORD does: an instance which is the broker, the result backend
    # and the cache of this fleet must never answer an unauthenticated
    # client. Every client of the project reads the same variable
    # (MrMap/settings.py). The value reaches the server through the
    # container's own environment - `$$`, not an interpolated `$` - so it stays
    # out of the published service config and out of `docker inspect`. A compose
    # variable cannot name the image's own
    # `redis-server` binary path, hence `sh -c`. Read-only rootfs is not
    # added here: the service writes its RDB snapshots and its temp files to
    # /data (the named volume).
    command: ["sh", "-c", "exec redis-server /usr/local/etc/redis/redis.conf --maxmemory \"${REDIS_MAXMEMORY:-768mb}\" --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - type: volume
        source: mem-db-data
        target: /data
      - type: bind
        source: ./docker/redis/redis.conf
        target: /usr/local/etc/redis/redis.conf
        read_only: true
    networks:
      - mrmap-internal
    environment:
      - loglevel=error
      # the credential both the server (``--requirepass`` above) and the
      # healthcheck below read; `:?` at compose level is what refuses an
      # unauthenticated instance of #1473
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Please configure REDIS_PASSWORD in the .env file}
    healthcheck:
      # the credential of the service itself: since #1473 the instance only
      # answers an authenticated client, `redis-cli ping` alone would make a
      # healthy redis read as unhealthy
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s

  docker-api:
    image: haproxy:3.4-alpine
    user: "0:0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/docker-api/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - docker-status
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/alpine.Dockerfile
      args:
        MRMAP_PRODUCTION: "True"
    restart: unless-stopped
    hostname: "backend"
    volumes:
      - type: bind
        source: ./backend
        target: /opt/mrmap
      # No mount for /var/www/mrmap/backend (Django's STATIC_ROOT): this
      # service never writes it and must not seed a volume with its emptiness
      # either. The collectstatic output is built into the image of the
      # `frontend` service, which serves it. (#922)
      - type: volume
        source: backend-media
        target: /var/mrmap/backend/media
      - type: volume
        source: backend-log
        target: /var/log/mrmap/backend
      - type: volume
        source: backend-import
        target: /var/mrmap/import
    networks:
      - mrmap-internal
      - docker-status
    environment:
      <<: *proxy-env
      SYSTEM_STATUS_DOCKER_PROJECT: "${COMPOSE_PROJECT_NAME}"
      SYSTEM_STATUS_DOCKER_URL: "http://docker-api:2375"
      EXTERNAL_BASE_URL: "${EXTERNAL_BASE_URL:?Please configure EXTERNAL_BASE_URL in the .env file}"
      # deployer knob of Django's host allow-list (#949), ";"/"," separated, empty = presets only
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-}"
      # deployer knobs of the fetch host policy (#1474): CIDR lists which open or close
      # the ranges the backend may connect to when it fetches a URL somebody else wrote.
      # docs/source/administration/fetch-host-policy.md
      MRMAP_FETCH_ALLOW_NETWORKS: "${MRMAP_FETCH_ALLOW_NETWORKS:-}"
      MRMAP_FETCH_DENY_NETWORKS: "${MRMAP_FETCH_DENY_NETWORKS:-}"
      # The transport-security block of #1473, so that the opt-outs documented
      # in docs/source/development/environment.rst are reachable from the
      # deployment's .env at all: compose interpolates .env only into entries
      # this file names, so a variable which is not listed here never reaches
      # Django, and an operator who follows the documentation to narrow one
      # setting of the block narrows nothing. Listed for all three services
      # which import the settings, as #1474 does for its fetch policy: one
      # deployment value read by one module must read the same in the web tier
      # and in the workers, or the boot warnings of the block (no CORS origins,
      # redirect without HSTS) say one thing in one process and the opposite in
      # another.
      #
      # A name with **no value** is what makes this work, and it is not the form
      # used above. ``NAME: "${NAME:-}"`` always *sets* the variable, to the
      # empty string when .env is silent, and three readers of this family read
      # an empty value as an explicit decision: ``DJANGO_COOKIE_SECURE=''`` would
      # ship a production session cookie without ``Secure``, an empty
      # ``DJANGO_CONTENT_SECURITY_POLICY`` turns the policy off, and
      # ``DJANGO_SECURE_HSTS_SECONDS=''`` does not even parse. Passing a knob
      # through that way would therefore weaken the deployment the moment it is
      # wired, which is the opposite of what the block is for. A name on its own
      # is passed only when the environment of the compose run actually carries
      # it: unset stays unset, settings.py sees no value and keeps the default
      # of the deployment mode. (The same property is why no name below may ever
      # appear in ``docker/backend/.mrmap.env``: a name declared here with no
      # value and nothing to pass is *removed* from the container, the
      # ``env_file`` included - measured against this file's own env_file, which
      # keeps its other entries and loses only the shadowed one. None of these
      # names is in that file, and one added there would silently stop working.)
      DJANGO_SECURE_SSL_REDIRECT:
      DJANGO_SECURE_HSTS_SECONDS:
      DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS:
      DJANGO_SECURE_HSTS_PRELOAD:
      DJANGO_SECURE_CONTENT_TYPE_NOSNIFF:
      DJANGO_SECURE_REFERRER_POLICY:
      DJANGO_X_FRAME_OPTIONS:
      DJANGO_COOKIE_SECURE:
      DJANGO_CORS_ALLOWED_ORIGINS:
      DJANGO_CSRF_TRUSTED_ORIGINS:
      DJANGO_CONTENT_SECURITY_POLICY:
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?Please configure DJANGO_SECRET_KEY in the .env file}"
      # the credential of the shared redis instance (#1473), which this process
      # reads for its broker, its result backend, its cache and its channel
      # layer (MrMap/settings.py); the same value the redis service starts with
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Please configure REDIS_PASSWORD in the .env file}"
      MRMAP_USER: "${DJANGO_ADMIN_USER:?Please configure DJANGO_ADMIN_USER in the .env file}"
      MRMAP_PASSWORD: "${DJANGO_ADMIN_PASSWORD:?Please configure DJANGO_ADMIN_PASSWORD in the .env file}"
      SQL_USER: "${DB_USER:?Please configure DB_PASSWORD in the .env file}"
      SQL_PASSWORD: "${DB_PASSWORD:?Please configure DB_PASSWORD in the .env file}"
      # The process shape of the web tier is resolved by
      # backend/.bash_scripts/process_defaults.sh, which these lines pass
      # through untouched; an unset variable stays unset there and lands on
      # the shipped production defaults (4 workers x 4 threads HTTP, 1 ASGI
      # websocket worker, no preload). MRMAP_LOW_MEMORY selects the
      # low-memory shape (1 HTTP worker x 2 threads) of #1617, and
      # GUNICORN_PRELOAD lets the HTTP workers fork one pre-imported
      # application; both readings are in
      # docs/source/development/http-process-profiles.rst (#1617).
      # The pool bounds which those processes open against PostGIS
      # (MIN/MAX_BACKEND_RESERVED_CONNECTIONS, #1621) are deliberately not
      # listed here: settings reads them from the environment, and listing
      # them with the empty fallback of a pass-through would shadow the
      # value a deployment sets for them in docker/backend/.mrmap.env, which
      # is where MAX_BACKEND_RESERVED_CONNECTIONS has always been set.
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-}
      GUNICORN_WS_WORKERS: ${GUNICORN_WS_WORKERS:-}
      MRMAP_LOW_MEMORY: ${MRMAP_LOW_MEMORY:-}
      GUNICORN_PRELOAD: ${GUNICORN_PRELOAD:-}
    env_file:
      - docker/backend/.mrmap.env
    depends_on:
      docker-api:
        condition: service_started
      postgis:
        # gate on the pg_isready healthcheck, not on process start: after an
        # unclean shutdown the postmaster listens for a while before it
        # accepts connections (#901)
        condition: service_healthy
      redis:
        condition: service_healthy
      victoria-logs:
        condition: service_started

  celery-worker:
    build:
      context: ./backend
      dockerfile: ../docker/backend/alpine.Dockerfile
      args:
        MRMAP_PRODUCTION: "True"
    # deploy:
    #   replicas: 10
    # No -Q on purpose: the worker consumes every queue the app declares
    # (CELERY_TASK_QUEUES over backend/MrMap/celery_queues.py), so a release
    # which adds a queue is consumed by a restarted deployment without any
    # override restating the list (#1040). The number of worker slots comes
    # from CELERY_WORKER_CONCURRENCY in the .env, below; a worker narrowed
    # to a part of the queues with its own -Q logs an ERROR naming the
    # queues it cannot deliver from at every start.
    command: >
      /bin/sh -c "celery -A MrMap worker -E -l INFO --statedb=/var/run/celery/%n-%i_worker.state"
    # Do not activate tty!!!!! This will freeze the worker process in case of console spamming.
    # See: https://stackoverflow.com/questions/48021772/docker-process-hangs-on-write-system-call-to-stdout
    #tty: true # To support colorized log output.
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./backend
        target: /opt/mrmap
      - type: volume
        source: backend-media
        target: /var/mrmap/backend/media
      - type: volume
        source: backend-log
        target: /var/log/mrmap/backend
      - type: volume
        source: backend-import
        target: /var/mrmap/import
      - type: volume
        source: celery-state
        target: /var/run/celery
    networks:
      - mrmap-internal
    environment:
      <<: *proxy-env
      EXTERNAL_BASE_URL: "${EXTERNAL_BASE_URL:?Please configure EXTERNAL_BASE_URL in the .env file}"
      # deployer knob of Django's host allow-list (#949), ";"/"," separated, empty = presets only
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-}"
      # deployer knobs of the fetch host policy (#1474): CIDR lists which open or close
      # the ranges the backend may connect to when it fetches a URL somebody else wrote.
      # docs/source/administration/fetch-host-policy.md
      MRMAP_FETCH_ALLOW_NETWORKS: "${MRMAP_FETCH_ALLOW_NETWORKS:-}"
      MRMAP_FETCH_DENY_NETWORKS: "${MRMAP_FETCH_DENY_NETWORKS:-}"
      # The transport-security block of #1473, so that the opt-outs documented
      # in docs/source/development/environment.rst are reachable from the
      # deployment's .env at all: compose interpolates .env only into entries
      # this file names, so a variable which is not listed here never reaches
      # Django, and an operator who follows the documentation to narrow one
      # setting of the block narrows nothing. Listed for all three services
      # which import the settings, as #1474 does for its fetch policy: one
      # deployment value read by one module must read the same in the web tier
      # and in the workers, or the boot warnings of the block (no CORS origins,
      # redirect without HSTS) say one thing in one process and the opposite in
      # another.
      #
      # A name with **no value** is what makes this work, and it is not the form
      # used above. ``NAME: "${NAME:-}"`` always *sets* the variable, to the
      # empty string when .env is silent, and three readers of this family read
      # an empty value as an explicit decision: ``DJANGO_COOKIE_SECURE=''`` would
      # ship a production session cookie without ``Secure``, an empty
      # ``DJANGO_CONTENT_SECURITY_POLICY`` turns the policy off, and
      # ``DJANGO_SECURE_HSTS_SECONDS=''`` does not even parse. Passing a knob
      # through that way would therefore weaken the deployment the moment it is
      # wired, which is the opposite of what the block is for. A name on its own
      # is passed only when the environment of the compose run actually carries
      # it: unset stays unset, settings.py sees no value and keeps the default
      # of the deployment mode. (The same property is why no name below may ever
      # appear in ``docker/backend/.mrmap.env``: a name declared here with no
      # value and nothing to pass is *removed* from the container, the
      # ``env_file`` included - measured against this file's own env_file, which
      # keeps its other entries and loses only the shadowed one. None of these
      # names is in that file, and one added there would silently stop working.)
      DJANGO_SECURE_SSL_REDIRECT:
      DJANGO_SECURE_HSTS_SECONDS:
      DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS:
      DJANGO_SECURE_HSTS_PRELOAD:
      DJANGO_SECURE_CONTENT_TYPE_NOSNIFF:
      DJANGO_SECURE_REFERRER_POLICY:
      DJANGO_X_FRAME_OPTIONS:
      DJANGO_COOKIE_SECURE:
      DJANGO_CORS_ALLOWED_ORIGINS:
      DJANGO_CSRF_TRUSTED_ORIGINS:
      DJANGO_CONTENT_SECURITY_POLICY:
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?Please configure DJANGO_SECRET_KEY in the .env file}"
      # the credential of the shared redis instance (#1473), which this process
      # reads for its broker, its result backend, its cache and its channel
      # layer (MrMap/settings.py); the same value the redis service starts with
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Please configure REDIS_PASSWORD in the .env file}"
      MRMAP_USER: "${DJANGO_ADMIN_USER:?Please configure DJANGO_ADMIN_USER in the .env file}"
      MRMAP_PASSWORD: "${DJANGO_ADMIN_PASSWORD:?Please configure DJANGO_ADMIN_PASSWORD in the .env file}"
      SQL_USER: "${DB_USER:?Please configure DB_PASSWORD in the .env file}"
      SQL_PASSWORD: "${DB_PASSWORD:?Please configure DB_PASSWORD in the .env file}"
      # deployer knob for the worker slots (#1040); unset or empty now
      # defaults the worker to 4 slots (#1454) instead of handing celery
      # its own default of one slot per host core - against the container's
      # memory limit that pool was the OOM path behind stuck jobs. "auto"
      # sizes by the container's cgroup quota; see
      # docs/source/development/environment.rst
      CELERY_WORKER_CONCURRENCY: "${CELERY_WORKER_CONCURRENCY:-4}"
      # recycling of one prefork child (#1615): how many tasks a slot runs
      # before it is replaced, and the kB of peak resident memory (celery
      # compares ru_maxrss, after a completed task) at which it is replaced.
      # Empty is the 1000 of the release, not "never": the worker reads this
      # variable itself and the pool refuses 0, so a value below 1 stops the
      # worker at start-up. The memory bound ships off because a fresh child
      # already peaks near 170 MB of the quantity celery compares (ru_maxrss)
      # and the import path plateaus at 211 MB; the measurement, and which
      # quantity a deployment has to watch to name a bound, is in
      # docs/source/development/celery-queues.rst
      CELERY_WORKER_MAX_TASKS_PER_CHILD: "${CELERY_WORKER_MAX_TASKS_PER_CHILD:-1000}"
      CELERY_WORKER_MAX_MEMORY_PER_CHILD: "${CELERY_WORKER_MAX_MEMORY_PER_CHILD:-}"
      # celery reads the revocation window from the environment, not from the
      # app configuration (celery/worker/state.py), so it belongs to the
      # service and not to the settings of the project - where the same name
      # measured inert for years (#1615). The value is the old intent of those
      # settings: a big catalogue revokes past celery's 50000 default.
      CELERY_WORKER_REVOKES_MAX: "${CELERY_WORKER_REVOKES_MAX:-2000000}"
    env_file:
      - ./docker/backend/.mrmap.env
    depends_on:
      postgis:
        # see backend: wait for the pg_isready healthcheck, not just the start (#901)
        condition: service_healthy
      redis:
        condition: service_healthy
    cap_add:
      - SYS_PTRACE
    healthcheck:
      # the module probe instead of the celery CLI: the same directed inspect
      # ping without Django startup, about a quarter less CPU per probe. The
      # CLI arm spent this whole timeout when the broker was paused, where the
      # probe reports the same loss in under 4 s (#1616). Interval, timeout,
      # retries and start_period are the values both arms were measured with.
      test: ["CMD-SHELL", "python -m system.worker_healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 40s

  celery-beat:
    build:
      context: ./backend
      dockerfile: ../docker/backend/alpine.Dockerfile
      args:
        MRMAP_PRODUCTION: "True"
    command: >
      /bin/sh -c "celery -A MrMap beat --loglevel INFO --scheduler system.scheduler:HealthcheckScheduler --max-interval 10"
    restart: unless-stopped
    tty: true # To support colorized log output.
    hostname: "mrmap-celery-beat"
    volumes:
      - type: bind
        source: ./backend
        target: /opt/mrmap
      - type: volume
        source: backend-media
        target: /var/mrmap/backend/media
      - type: volume
        source: backend-log
        target: /var/log/mrmap/backend
      - type: volume
        source: backend-import
        target: /var/mrmap/import
    networks:
      - mrmap-internal
    environment:
      EXTERNAL_BASE_URL: "${EXTERNAL_BASE_URL:?Please configure EXTERNAL_BASE_URL in the .env file}"
      # deployer knob of Django's host allow-list (#949), ";"/"," separated, empty = presets only
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-}"
      # deployer knobs of the fetch host policy (#1474): CIDR lists which open or close
      # the ranges the backend may connect to when it fetches a URL somebody else wrote.
      # docs/source/administration/fetch-host-policy.md
      MRMAP_FETCH_ALLOW_NETWORKS: "${MRMAP_FETCH_ALLOW_NETWORKS:-}"
      MRMAP_FETCH_DENY_NETWORKS: "${MRMAP_FETCH_DENY_NETWORKS:-}"
      # The transport-security block of #1473, so that the opt-outs documented
      # in docs/source/development/environment.rst are reachable from the
      # deployment's .env at all: compose interpolates .env only into entries
      # this file names, so a variable which is not listed here never reaches
      # Django, and an operator who follows the documentation to narrow one
      # setting of the block narrows nothing. Listed for all three services
      # which import the settings, as #1474 does for its fetch policy: one
      # deployment value read by one module must read the same in the web tier
      # and in the workers, or the boot warnings of the block (no CORS origins,
      # redirect without HSTS) say one thing in one process and the opposite in
      # another.
      #
      # A name with **no value** is what makes this work, and it is not the form
      # used above. ``NAME: "${NAME:-}"`` always *sets* the variable, to the
      # empty string when .env is silent, and three readers of this family read
      # an empty value as an explicit decision: ``DJANGO_COOKIE_SECURE=''`` would
      # ship a production session cookie without ``Secure``, an empty
      # ``DJANGO_CONTENT_SECURITY_POLICY`` turns the policy off, and
      # ``DJANGO_SECURE_HSTS_SECONDS=''`` does not even parse. Passing a knob
      # through that way would therefore weaken the deployment the moment it is
      # wired, which is the opposite of what the block is for. A name on its own
