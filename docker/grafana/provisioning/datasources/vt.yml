apiVersion: 1
# Trace store of the optional OpenTelemetry path (#1778, ADR-0003). It answers
# the Tempo HTTP API, so Grafana's built-in Tempo datasource queries it and the
# Traces Drilldown app explores it: no third-party plugin and no Jaeger UI is
# deployed for traces. The URL carries the prefix the store serves its
# Jaeger/Tempo query API under, again through the proxy of this UI.
#
# Span-to-log links are deliberately unconfigured: the correlation fields which
# would make them resolve belong to #1785, and a mapping pointing at nothing
# would only look broken in the UI.
datasources:
  - name: VictoriaTraces
    uid: victoriatraces
    type: tempo
    access: proxy
    url: http://victoria-traces:10428/select/tempo
    editable: true
