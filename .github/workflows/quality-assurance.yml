name: Quality Assurance
on:
  workflow_dispatch:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
    types: [opened, synchronize, reopened]
  schedule:
    - cron: 0 16 * * *

permissions:
  contents: read

# Disposable test credentials; no deployment secrets are needed, including for fork PRs.
# Compose interpolates every service, so these also cover services not started by QA.
env:
  COMPOSE_PROJECT_NAME: mrmap-ci
  EXTERNAL_BASE_URL: localhost
  EXTERNAL_PORT: 8000
  EXTERNAL_SCHEME: http
  DB_USER: mrmap
  DB_PASSWORD: mrmap-ci-password
  # Acceptance scenarios authenticate the seeded administrator as mrmap/mrmap.
  DJANGO_ADMIN_USER: mrmap
  DJANGO_ADMIN_PASSWORD: mrmap
  DJANGO_SECRET_KEY: mrmap-ci-secret-key-for-disposable-test-containers
  OPENOBSERVE_USER: admin@example.com
  OPENOBSERVE_PASSWORD: mrmap-ci-password
  PGADMIN_USER: admin@example.com
  PGADMIN_PASSWORD: mrmap-ci-password

jobs:
  pre-commit-checks:
    name: pre-commit-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run pre commit checks
        # Match checkout ownership so translation checks can write to the bind mount.
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml run --rm --build --user "$(id -u):$(id -g)" pre-commit-check

  acceptance-tests:
    name: acceptance-tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run behave tests
        # Match checkout ownership so coverage can write to the bind mount.
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml run --rm --build --user "$(id -u):$(id -g)" behave

      - name: upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-tests-coverage-report
          if-no-files-found: error
          path: ./backend/acceptance-tests-coverage-report.xml

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run unit tests
        # Match checkout ownership so coverage can write to the bind mount.
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml run --rm --build --user "$(id -u):$(id -g)" django-tests

      - name: upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: unit-tests-coverage-report
          if-no-files-found: error
          path: ./backend/unit-tests-coverage-report.xml

  frontend-tests:
    name: frontend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout repo
        uses: actions/checkout@v7

      - name: Install frontend dependencies
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml run --rm frontend-tests npm ci --no-audit --no-fund

      - name: Type check frontend
        # Informational for now: tsc reports 114 errors on main (see
        # frontend/AGENTS.md "Known red baselines"). Remove continue-on-error
        # once they are fixed.
        continue-on-error: true
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml run --rm frontend-tests npm run type-check

      - name: Run frontend tests
        # Informational for now: 52-56 of 268 specs fail on main (see
        # frontend/AGENTS.md "Known red baselines"). Remove continue-on-error
        # once the failing specs are fixed.
        continue-on-error: true
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml run --rm frontend-tests npm run test -- --run
