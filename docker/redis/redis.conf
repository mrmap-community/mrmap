# Eviction policy of the shared Redis instance (#1618).
#
# One instance serves three purposes with different contracts: the celery
# broker (DB 0, queue lists which must never be dropped), the celery result
# backend and chord bookkeeping (DB 0, celery-task-meta-* with a TTL) and the
# Django cache (DB 1). Without a bound Redis grows until the kernel OOM-kills
# it and the broker dies with it; with the wrong bound it silently discards
# queue data. volatile-lru is the policy which bounds the process and keeps
# that promise: only keys which already carry an expiry can be evicted, so the
# broker's queue and unacked lists are never a victim, while cache entries and
# result/chord keys - all written with a TTL - give way first.
#
# The consequence for results: under sustained pressure an old
# celery-task-meta-* key can be evicted before its TTL passes, and reading it
# then answers "no such key" instead of a state. That is the explicit OOM
# strategy of this deployment: a lost result is loud at the consumer
# (AsyncTaskResult throws NotFound, a chord raises) while the queued work
# survives and is delivered. allkeys-* would instead drop broker keys without
# an error, which is why this file exists.
#
# The maxmemory itself is NOT set here: docker-compose.yml passes it as a
# command-line override from ${REDIS_MAXMEMORY:-768mb}, because the right
# number depends on the host and belongs to the deployment, not to the image.
#
# Persistence stays at the image defaults (RDB snapshots, no AOF): with
# acks_late off, the broker relies on the queue surviving a restart, and the
# snapshot cadence is the recovery point objective of that decision. Changing
# it is out of scope here.
maxmemory-policy volatile-lru
