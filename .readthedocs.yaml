# Read the Docs build of the documentation portal (#1597, epic #1589).
#
# The portal builds from one committed pin file - backend/.requirements/docs.txt -
# and this file uses it rather than a second set of pins of its own. The previous
# configuration installed backend/requirements.txt, the whole application, so the
# documentation deployment needed Django, GDAL and apt's gdal-bin to answer a
# question about prose, and it pinned os: ubuntu-20.04 with python 3.8, both out
# of support and both below what Sphinx 8 requires - the configuration could not
# have built the toolchain this issue pinned, which is one reason nothing noticed
# that the committed pins were internally contradictory (#1597).
#
# No apt_packages: nothing here needs GDAL. If a future page needs a package, it
# belongs in the pin file, not here, so that the docs image, this service and a
# contributor's venv stay three builds of one environment.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    # The corpus is link-checked before the pages are written: a broken URL is
    # reported with the build it belongs to. HTML is built with -W by
    # .github/workflows/docs.yml, where the whole set of warnings is listed
    # rather than the build stopping at the first.
    pre_build:
      - python -m sphinx -b linkcheck -E --keep-going docs/source _build/linkcheck

python:
  install:
    - requirements: backend/.requirements/docs.txt

sphinx:
  builder: html
  configuration: docs/source/conf.py
  # Strict: a warning is a failure. Reachability of every page, every cross
  # reference and every asset is asserted this way rather than eyeballed.
  fail_on_warning: true
