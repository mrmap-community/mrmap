name: PR Classification

# WHY THIS CHECK EXISTS, AND WHY IT READS THE PULL REQUEST AND NOTHING ELSE.
#
# #1578 measured what the release tool of #1581 will have to work from: 7585 commits on
# `develop`, 53 of them readable as a Conventional header, 833 merge commits written by
# GitHub, and no tag or release ever cut. A change that cannot be classified cannot be
# put in a release note, and the one string that reliably reaches the integration history
# of this repository is the pull request title: GitHub writes it as the body of the merge
# commit, and that is the whole body. Everything else a developer writes into a commit
# message is folded away at the merge and lost. So the title is what gets enforced, and a
# breaking marker written only in a commit is reported as a loss, because that is exactly
# what it is.
#
# The rules, the vocabulary and the dedupe semantics live in scripts/pr_classify and are
# documented in docs/source/development/commit-classification.rst. This workflow is only
# the transport: it hands the tool the pull request's title, its description and its
# commits, and passes the tool's exit code through. Nothing is duplicated here, because a
# second copy of a rule in a workflow file is a second copy that drifts.
#
# What this check deliberately is not:
#   * not an approver. It says whether a change can be classified, never whether it
#     should be merged. Approval, merge, resolve and branch protection stay with people.
#   * not a bypass. It triggers on the ordinary pull-request events and nothing else;
#     there is no path here that skips it for a branch, an author or a label.
#   * not a surprise. The rollout is advisory until the date scripts/pr_classify names,
#     because 99 % of this repository's history and every pull request already open when
#     this landed are written in the old style. Until that date the check reports and
#     exits 0; from it, the same findings fail. Nobody has to retitle a finished branch
#     under their feet, and nobody has to retitle history.
#   * not run on `merge_group`: the queue merges a branch that already answered for
#     itself, and a rule that only fails in the queue tells the wrong person.

on:
  pull_request:
    branches:
      - master
      - develop
    types:
      - opened
      - reopened
      - synchronize
      - edited

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify the change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Read from the event payload, not from the repository: a branch must not be able
      # to choose the text its own check reads.
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          # 3.13 is what the orchestration host runs scripts/ with; the tool is stdlib
          # only and needs neither GDAL nor the application.
          python-version: '3.15'

      # The commits of the pull request are what makes a hidden breaking change visible:
      # the marker may be written on a commit and never on the title, and then the merge
      # throws it away. `gh api` answers oldest first and paginates; the tool sorts the
      # records over the parent edges itself, so neither order nor page count matters.
      - name: Read the pull request's commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits" --paginate \
            > /tmp/pr-commits.json
          echo "read $(python3 -c "import json;print(len(json.load(open('/tmp/pr-commits.json'))))") commits"

      - name: Classify the pull request
        run: |
          printf '%s' "$PR_BODY" > /tmp/pr-body.txt
          python3 scripts/pr_classify pr \
            --title "$PR_TITLE" \
            --body-file /tmp/pr-body.txt \
            --commits-json /tmp/pr-commits.json
