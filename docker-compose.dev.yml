# docker compose file for development useage
services:

  frontend:
    build:
      context: ./
      dockerfile: ./docker/nginx/nginx.Dockerfile

  # Extend the existing postgis container with an accessible port for development purposes
  postgis:
    ports:
      - 5555:5432

  redis:
    ports:
      - 5556:6379

  inspire-validator:
    build:
      context: ./docker/inspire-validator
    ports:
      - "5557:8080"
    networks:
      - mrmap-internal
    extra_hosts:
      - host.docker.internal:host-gateway


  mapserver:
    image: camptocamp/mapserver:8.6
    hostname: "mrmap-mapserver"
    environment:
      # Keep the CGI endpoint used by the proxy fixtures; v8 defaults to "/".
      MAPSERVER_BASE_PATH: /cgi-bin/mapserv
    volumes:
      - type: bind
        source: ./docker/mapserver/mapfiles
        target: /etc/mapserver/mapfiles
      - type: bind
        source: ./docker/mapserver/shapefiles
        target: /etc/mapserver/shapefiles
    ports:
      - "8090:80"
    networks:
      - mrmap-internal

  pre-commit-check:
    build:
      context: ./backend
      dockerfile: ../docker/backend/alpine.Dockerfile
      args:
        MRMAP_PRODUCTION: 'False'
    entrypoint: /opt/mrmap/.bash_scripts/wait_db.sh
    command: /bin/sh -c "/opt/mrmap/.bash_scripts/pre_commit_check.sh"
    environment:
      EXTERNAL_BASE_URL: "${EXTERNAL_BASE_URL:?Please configure EXTERNAL_BASE_URL in the .env file}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?Please configure DJANGO_SECRET_KEY in the .env file}"
      MRMAP_USER: "${DJANGO_ADMIN_USER:?Please configure DJANGO_ADMIN_USER in the .env file}"
      MRMAP_PASSWORD: "${DJANGO_ADMIN_PASSWORD:?Please configure DJANGO_ADMIN_PASSWORD in the .env file}"
      SQL_USER: "${DB_USER:?Please configure DB_PASSWORD in the .env file}"
      SQL_PASSWORD: "${DB_PASSWORD:?Please configure DB_PASSWORD in the .env file}"
    hostname: "mrmap-test"
    volumes:
      - type: bind
        source: ./backend
        target: /opt/mrmap
    networks:
      - mrmap-internal
    env_file:
      - ./docker/backend/.mrmap.env
    depends_on:
      - postgis
      - redis

  behave:
    build:
      context: ./backend
      dockerfile: ../docker/backend/alpine.Dockerfile
      args:
        MRMAP_PRODUCTION: 'False'
    shm_size: '2gb' # Fix 'Failed to decode response from marionette' (https://stackoverflow.com/questions/49734915/)
    # Do not activate tty!!!!! Analog issues as for celery-worker.. it can cause auto attaching issues..
    #tty: true # To support colorized log output of gherkin and other log information. 
    entrypoint: /opt/mrmap/.bash_scripts/wait_db.sh
    command: >
      /bin/sh -c "python -m coverage run --data-file=.coverage.acceptance /opt/mrmap/manage.py behave --simple --noinput --tags=-skip --no-skipped tests/behave/features && python -m coverage xml --data-file=.coverage.acceptance -o acceptance-tests-coverage-report.xml"
    hostname: "mrmap-behave"
    volumes:
      - type: bind
        source: ./backend
        target: /opt/mrmap
    networks:
      - mrmap-internal
    env_file:
      - ./docker/backend/.mrmap.env

    environment:
      EXTERNAL_BASE_URL: "${EXTERNAL_BASE_URL:?Please configure EXTERNAL_BASE_URL in the .env file}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?Please configure DJANGO_SECRET_KEY in the .env file}"
      MRMAP_USER: "${DJANGO_ADMIN_USER:?Please configure DJANGO_ADMIN_USER in the .env file}"
      MRMAP_PASSWORD: "${DJANGO_ADMIN_PASSWORD:?Please configure DJANGO_ADMIN_PASSWORD in the .env file}"
      SQL_USER: "${DB_USER:?Please configure DB_PASSWORD in the .env file}"
      SQL_PASSWORD: "${DB_PASSWORD:?Please configure DB_PASSWORD in the .env file}"
      DJANGO_DEBUG: 0
      MRMAP_PRODUCTION: False
    depends_on:
      - postgis
      - redis

  django-tests:
    build:
      context: ./backend
      dockerfile: ../docker/backend/alpine.Dockerfile
      args:
        MRMAP_PRODUCTION: 'False'
    shm_size: '2gb' # Fix 'Failed to decode response from marionette' (https://stackoverflow.com/questions/49734915/)
    # Do not activate tty!!!!! Analog issues as for celery-worker.. it can cause auto attaching issues..
    #tty: true # To support colorized log output of gherkin and other log information. 
    entrypoint: /opt/mrmap/.bash_scripts/wait_db.sh
    # --parallel=4 runs the suite in forked workers. Measured on this checkout (1312 tests, same
    # stack each time): 655 s in one process, 356 s with two (355 s on a repeat), 225 s with four;
    # the peak of the container's memory cgroup was 12.5 GiB serial and 12.1 GiB with four, so the
    # workers are not paid for in memory. The count is written out instead of left to the default
    # (the machine's cpu count), because Django brings up one PostGIS test database per worker:
    # a 20-core host would clone the schema twenty times.
    # COVERAGE_FILE is not a duplicate of --data-file. A forked worker inherits the environment of
    # its parent but not its command line, so without this the workers write data files the report
    # step never looks for and every line only a worker executed is silently missing from the XML
    # that CI uploads - the command still exits 0. Together with `concurrency = multiprocessing`
    # in backend/setup.cfg, both facts are pinned by scripts/test_coverage_parallel_data.py.
    command: >
      /bin/sh -c "COVERAGE_FILE=.coverage.unit python -m coverage run --data-file=.coverage.unit ./manage.py test -v 3 /opt/mrmap/tests/ --noinput --parallel=4 && python -m coverage xml --data-file=.coverage.unit -o unit-tests-coverage-report.xml"
    hostname: "mrmap-django-tests"
    volumes:
      - type: bind
        source: ./backend
        target: /opt/mrmap
    networks:
      - mrmap-internal
    env_file:
      - ./docker/backend/.mrmap.env
    environment:
      DJANGO_DEBUG: 1
      MRMAP_PRODUCTION: False
      EXTERNAL_BASE_URL: "${EXTERNAL_BASE_URL:?Please configure EXTERNAL_BASE_URL in the .env file}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?Please configure DJANGO_SECRET_KEY in the .env file}"
      MRMAP_USER: "${DJANGO_ADMIN_USER:?Please configure DJANGO_ADMIN_USER in the .env file}"
      MRMAP_PASSWORD: "${DJANGO_ADMIN_PASSWORD:?Please configure DJANGO_ADMIN_PASSWORD in the .env file}"
      SQL_USER: "${DB_USER:?Please configure DB_PASSWORD in the .env file}"
      SQL_PASSWORD: "${DB_PASSWORD:?Please configure DB_PASSWORD in the .env file}"
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      # explicitly override passed in environment variables.
      # hierachy: image defaults --> docker client defaults from config.json -> env_file -> environment definition on compose level
      #HTTP_PROXY: ""
      #HTTPS_PROXY: ""
      #http_proxy: ""
      #https_proxy: ""
      NO_PROXY: "127.0.0.1,localhost,mrmap-mapserver"
      no_proxy: "127.0.0.1,localhost,mrmap-mapserver"

    depends_on:
      - postgis
      - redis
      - mapserver

  backend:
    build:
      args:
        MRMAP_PRODUCTION: "False"
    container_name: backend-dev
    environment:
      - DJANGO_DEBUG=1
      - MRMAP_PRODUCTION=False
    env_file:
      - docker/backend/.mrmap.env
    ports:
      - "0.0.0.0:8001:8001"
    # The websockets of #1032 - needed here although `runserver` does speak an
    # upgrade, because of where the browser asks: the SPA builds its socket url
    # from VITE_API_* (frontend/src/jsonapi/components/Realtime/RealtimeBus.tsx),
    # so /ws/default/ goes to the edge of this stack and never to port 8001. The
    # edge of the development stack is the same container with the same
    # docker/nginx/mrmap.conf which docker-compose.yml bind-mounts and this file
    # only rebuilds, and that conf names port 8002 for /ws in every stack. So
    # without this, the socket of a development page answers 502 at the edge
    # while runserver waits on 8001 for a question nobody asks. The table of that
    # one conf is tested by scripts/nginx_routing_smoke.py, and a second
    # development-only conf is the drift the script exists to keep out.
    # The autoreloader of runserver does not reach this second process: restart
    # the service after changing a consumer.
    command: >
      /bin/sh -c "/opt/mrmap/.bash_scripts/startup_ws.sh & python manage.py runserver 0.0.0.0:8001"
    depends_on:
      postgis:
        condition: service_started
      redis:
        condition: service_healthy

  celery-worker:
    build:
      args:
        MRMAP_PRODUCTION: "False"
    environment:
      - DJANGO_DEBUG=1
      - MRMAP_PRODUCTION=False
    env_file:
      - ./docker/backend/.mrmap.env
    command: >
      /bin/sh -c "watchmedo auto-restart --directory=./ --pattern=*.py --recursive -- celery -A MrMap worker -E -l DEBUG --statedb=/var/run/celery/%n-%i_worker.state"
    depends_on:
      postgis:
        condition: service_started
      redis:
        condition: service_healthy

  celery-beat:
    build:
      args:
        MRMAP_PRODUCTION: "False"
    environment:
      - DJANGO_DEBUG=1
      - MRMAP_PRODUCTION=False
    env_file:
      - ./docker/backend/.mrmap.env
    command: >
      /bin/sh -c "watchmedo auto-restart --directory=./ --pattern=*.py --recursive -- celery -A MrMap beat --loglevel INFO --scheduler system.scheduler:HealthcheckScheduler --max-interval 10"
    depends_on:
      postgis:
        condition: service_started
      redis:
        condition: service_healthy

  flower:
    ports:
      - 5655:5555

  # Runs the frontend type check and unit tests without a host node/npm. Reads
  # no backend services, so it can be started standalone:
  # docker compose -f docker-compose.yml -f docker-compose.dev.yml run --rm frontend-tests
  # Pass another command to run a single spec or the type check, e.g.:
  # ... run --rm frontend-tests npx vitest --run src/components/Resource/HarvestingJob
  # ... run --rm frontend-tests npm run type-check
  frontend-tests:
    image: node:26-alpine
    hostname: "mrmap-frontend-tests"
    container_name: "mrmap-frontend-tests"
    working_dir: /opt/mrmap/frontend
    volumes:
      - type: bind
        source: ./frontend
        target: /opt/mrmap/frontend
      # Keeps npm dependencies out of the host checkout and warm between runs.
      - type: volume
        source: frontend-node-modules
        target: /opt/mrmap/frontend/node_modules
    command: >
      /bin/sh -c "npm ci --no-audit --no-fund && npm run test -- --run"
    networks:
      - mrmap-internal

volumes:
  frontend-node-modules: null
