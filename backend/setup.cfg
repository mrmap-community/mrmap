[flake8]
# Mirrors the flags CI passes in backend/.bash_scripts/pre_commit_check.sh
# ("flake8 --ignore E501,W503,W504 /opt/mrmap/ --exclude /opt/mrmap/tests/"), so a
# bare "flake8 <path>" run from backend/ reports exactly what CI will flag.
ignore = E501,W503,W504
exclude =
    tests

[coverage:run]
branch = True
source = .
relative_files = True
# The unit-test job runs its suite with `manage.py test --parallel=4`, and that runner executes
# the test cases in forked children. Coverage traces a forked child only when told to: without
# this key the report is silently smaller, because every line that only a worker executed is
# missing from unit-tests-coverage-report.xml and nothing fails. A child inherits the environment
# of the parent, not its `--data-file` argument, so the job also sets COVERAGE_FILE (see
# docker-compose.dev.yml). scripts/test_coverage_parallel_data.py pins both facts.
concurrency = multiprocessing
omit =
    tests/*
    */migrations/*
    manage.py

[coverage:report]
show_missing = True
skip_empty = True

[coverage:html]
directory = coverage/html

[coverage:xml]
output = coverage/coverage.xml
