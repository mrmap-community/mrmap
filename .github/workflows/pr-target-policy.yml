name: PR Target Policy

# #1592 supersedes mandatory epic targets. Retain the check context during cutover
# so a ruleset added after the audit cannot strand PRs awaiting a removed job.
# #1593 removes this compatibility workflow after an operator rechecks required
# contexts. Permanent-branch policy stays in branch-policy.yml; QA is unchanged.

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-pr-target:
    name: Validate PR target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the GitHub Flow cutover
        run: echo "Mandatory epic targets retired by issue 1592; use a small PR to develop."
