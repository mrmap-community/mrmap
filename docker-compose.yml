# docker compose file for productive useage
services:

  postgis:
    image: postgis/postgis:18-3.6-alpine
    # Disable Postgres JIT for the reference deployment (#871). The annotated
    # service-list query carries dozens of correlated SubPlans and its planner
    # cost (~700k at a realistic dataset, ~110k already with a few 10k records)
    # is above the default jit_above_cost = 100000, so the stock image re-JIT-
    # compiles it on *every* request: a ~360 ms compile over a ~360 ms query
    # (EXPLAIN ANALYZE: Execution 721 -> 363 ms, the JIT: block disappears).
    # These are one-shot OLTP queries whose plan is never reused, so JIT has no
    # chance to amortize. Nothing else in mrmap triggers JIT: the heavy reads
    # (harvest day statistics, tsvector search) cost a few thousand, far below
    # jit_above_cost, so jit=off never removes a JIT speed-up they could use.
    # A raised jit_above_cost would be brittle - the list query's cost grows
    # with the dataset, so it would cross any fixed value again. Set on the
    # server process (not ALTER SYSTEM, which would persist into the shared
    # data volume and leak into test databases); applies to every database.
    command: ["postgres", "-c", "jit=off"]
    # ship container stdout/stderr (postgres stderr log) into victoria-logs
    logging:
      driver: syslog
      options:
        syslog-address: "udp://127.0.0.1:5514"
        syslog-format: "rfc5424"
        syslog-facility: "local5"
        tag: "{{.Name}}"
    volumes:
      - type: volume
        source: db-data-18
        target: /var/lib/postgresql
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: 134217728 # 128*2^20 bytes = 128Mb
    networks:
      - mrmap-internal
    environment:
      POSTGRES_USER: "${DB_USER:?Please configure DB_USER in the .env file}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Please configure DB_PASSWORD in the .env file}"
      POSTGRES_DB: "${POSTGRES_DB:-mrmap}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
  # migration guide:
  # 1. backup current db => docker exec -it `container_id` pg_dumpall -U mrmap  > .upgrade_backup.sql
  # 2. call pg_extract script => backend/.bash_scripts/pg_extract.sh .upgrade_backup.sql mrmap >> upgrade_backup_mydb.sql
  # 3. change image definition to higher postgis; change volume source to new location; start container => docker compose up postgis --build
  # 4. cat upgrade_backup_mydb.sql | docker exec -i `container_id` psql -U mrmap
  # Done

  redis:
    image: library/redis:8.10.3-alpine
    volumes:
      - type: volume
        source: mem-db-data
        target: /data
    networks:
      - mrmap-internal
    environment:
      - loglevel=error
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s

  docker-api:
    image: haproxy:3.4-alpine
    user: "0:0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/docker-api/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - docker-status
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/alpine.Dockerfile
      args:
        MRMAP_PRODUCTION: "True"
    hostname: "backend"
    volumes:
      - type: bind
        source: ./backend
        target: /opt/mrmap
      - type: volume
        source: backend-static
        target: /var/www/mrmap/backend
      - type: volume
        source: backend-media
        target: /var/mrmap/backend/media
      - type: volume
        source: backend-log
        target: /var/log/mrmap/backend
      - type: volume
        source: backend-import
        target: /var/mrmap/import
    networks:
      - mrmap-internal
      - docker-status
    environment:
      SYSTEM_STATUS_DOCKER_PROJECT: "${COMPOSE_PROJECT_NAME}"
      SYSTEM_STATUS_DOCKER_URL: "http://docker-api:2375"
      EXTERNAL_BASE_URL: "${EXTERNAL_BASE_URL:?Please configure EXTERNAL_BASE_URL in the .env file}"
      # deployer knob of Django's host allow-list (#949), ";"/"," separated, empty = presets only
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?Please configure DJANGO_SECRET_KEY in the .env file}"
      MRMAP_USER: "${DJANGO_ADMIN_USER:?Please configure DJANGO_ADMIN_USER in the .env file}"
      MRMAP_PASSWORD: "${DJANGO_ADMIN_PASSWORD:?Please configure DJANGO_ADMIN_PASSWORD in the .env file}"
      SQL_USER: "${DB_USER:?Please configure DB_PASSWORD in the .env file}"
      SQL_PASSWORD: "${DB_PASSWORD:?Please configure DB_PASSWORD in the .env file}"
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
    env_file:
      - docker/backend/.mrmap.env
    depends_on:
      docker-api:
        condition: service_started
      postgis:
        condition: service_started
      redis:
        condition: service_healthy
      victoria-logs:
        condition: service_started

  celery-worker:
    build:
      context: ./backend
      dockerfile: ../docker/backend/alpine.Dockerfile
      args:
        MRMAP_PRODUCTION: "True"
    # deploy:
    #   replicas: 10
    command: >
      /bin/sh -c "celery -A MrMap worker -E -l INFO -Q download,default,db-routines,harvest-import,monitoring,update --statedb=/var/run/celery/%n-%i_worker.state"
    # Do not activate tty!!!!! This will freeze the worker process in case of console spamming. 
    # See: https://stackoverflow.com/questions/48021772/docker-process-hangs-on-write-system-call-to-stdout
    #tty: true # To support colorized log output.
    volumes:
      - type: bind
        source: ./backend
        target: /opt/mrmap
      - type: volume
        source: backend-media
        target: /var/mrmap/backend/media
      - type: volume
        source: backend-log
        target: /var/log/mrmap/backend
      - type: volume
        source: backend-import
        target: /var/mrmap/import
      - type: volume
        source: celery-state
        target: /var/run/celery
    networks:
      - mrmap-internal
    environment:
      EXTERNAL_BASE_URL: "${EXTERNAL_BASE_URL:?Please configure EXTERNAL_BASE_URL in the .env file}"
      # deployer knob of Django's host allow-list (#949), ";"/"," separated, empty = presets only
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?Please configure DJANGO_SECRET_KEY in the .env file}"
      MRMAP_USER: "${DJANGO_ADMIN_USER:?Please configure DJANGO_ADMIN_USER in the .env file}"
      MRMAP_PASSWORD: "${DJANGO_ADMIN_PASSWORD:?Please configure DJANGO_ADMIN_PASSWORD in the .env file}"
      SQL_USER: "${DB_USER:?Please configure DB_PASSWORD in the .env file}"
      SQL_PASSWORD: "${DB_PASSWORD:?Please configure DB_PASSWORD in the .env file}"
    env_file:
      - ./docker/backend/.mrmap.env
    depends_on:
      postgis:
        condition: service_started
      redis:
        condition: service_healthy
    cap_add:
      - SYS_PTRACE
    healthcheck:
      test: ["CMD-SHELL", "celery -A MrMap inspect ping --destination celery@$$HOSTNAME --timeout 2"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always

  celery-beat:
    build:
      context: ./backend
      dockerfile: ../docker/backend/alpine.Dockerfile
      args:
        MRMAP_PRODUCTION: "True"
    command: >
      /bin/sh -c "celery -A MrMap beat --loglevel INFO --scheduler system.scheduler:HealthcheckScheduler --max-interval 10"
    tty: true # To support colorized log output.
    hostname: "mrmap-celery-beat"
    volumes:
      - type: bind
        source: ./backend
        target: /opt/mrmap
      - type: volume
        source: backend-media
        target: /var/mrmap/backend/media
      - type: volume
        source: backend-log
        target: /var/log/mrmap/backend
      - type: volume
        source: backend-import
        target: /var/mrmap/import
    networks:
      - mrmap-internal
    environment:
      EXTERNAL_BASE_URL: "${EXTERNAL_BASE_URL:?Please configure EXTERNAL_BASE_URL in the .env file}"
      # deployer knob of Django's host allow-list (#949), ";"/"," separated, empty = presets only
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?Please configure DJANGO_SECRET_KEY in the .env file}"
      MRMAP_USER: "${DJANGO_ADMIN_USER:?Please configure DJANGO_ADMIN_USER in the .env file}"
      MRMAP_PASSWORD: "${DJANGO_ADMIN_PASSWORD:?Please configure DJANGO_ADMIN_PASSWORD in the .env file}"
      SQL_USER: "${DB_USER:?Please configure DB_PASSWORD in the .env file}"
      SQL_PASSWORD: "${DB_PASSWORD:?Please configure DB_PASSWORD in the .env file}"
    env_file:
      - ./docker/backend/.mrmap.env
    depends_on:
      postgis:
        condition: service_started
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,time; p=pathlib.Path('/var/mrmap/run/beat-heartbeat'); raise SystemExit(0 if p.exists() and 0 <= time.time()-p.stat().st_mtime < 30 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./
      dockerfile: ./docker/nginx/nginx.Dockerfile
      args:
        # For Production: Insert the correct schema and the correct hostname and port of the backend
        - VITE_API_BASE_URL=${EXTERNAL_BASE_URL:?Please configure EXTERNAL_BASE_URL in the .env file}
        - VITE_API_PORT=${EXTERNAL_PORT:?Please configure EXTERNAL_PORT in the .env file}
        - VITE_API_SCHEMA=${EXTERNAL_SCHEME:?Please configure EXTERNAL_SCHEME in the .env file}
    # nginx logs are symlinked to stdout/stderr, ship them into victoria-logs
    logging:
      driver: syslog
      options:
        syslog-address: "udp://127.0.0.1:5514"
        syslog-format: "rfc5424"
        syslog-facility: "local5"
        tag: "{{.Name}}"
    hostname: "nginx"
    environment:
      - no_proxy=${no_proxy:-localhost},backend,flower,pgadmin
      - NO_PROXY=${NO_PROXY:-localhost},backend,flower,pgadmin
    volumes:
      - type: bind
        source: ./docker/nginx/mrmap.conf
        target: /etc/nginx/conf.d/default.conf
      - type: volume
        source: backend-static
        target: /var/www/mrmap/backend
      - type: volume
        source: frontend-static
        target: /var/www/mrmap/frontend
    ports:
      - "${EXTERNAL_PORT:?Please configure EXTERNAL_PORT in the .env file}:80"
    depends_on:
      - backend
    networks:
      - mrmap-internal
    extra_hosts:
      - host.docker.internal:host-gateway

  # Central log store: native RFC 5424 syslog receiver, parses MrMap's
  # structured-data parameters into queryable fields. The HTTP API and the vmui
  # stay network-internal; Grafana is the only web entry point.
  victoria-logs:
    image: victoriametrics/victoria-logs:v1.53.0
    restart: unless-stopped
    hostname: "victoria-logs"
    command:
      - "-storageDataPath=/vlogs-data"
      - "-retentionPeriod=14d"
      - "-syslog.listenAddr.udp=:5514"
      - "-httpListenAddr=:9428"
    ports:
      # loopback only: docker's syslog log-driver (e.g. postgis) ships
      # container stdout/stderr host-side into this receiver
      - "127.0.0.1:5514:5514/udp"
    volumes:
      - vlogs-data:/vlogs-data
    networks:
      - mrmap-internal

  # Log UI with login/RBAC in front of victoria-logs (which stays network-internal)
  grafana:
    image: grafana/grafana:13.3.0
    restart: unless-stopped
    hostname: "grafana"
    environment:
      GF_SERVER_ROOT_URL: "http://%(domain)s:%(http_port)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:?Please configure GRAFANA_ADMIN_USER in the .env file}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Please configure GRAFANA_ADMIN_PASSWORD in the .env file}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL: "victoriametrics-logs-datasource"
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: "victoriametrics-logs-datasource"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - mrmap-internal

  pgadmin:
    image: dpage/pgadmin4:9.19
    restart: unless-stopped
    hostname: "pgadmin"
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_USER:?Please configure PGADMIN_USER in the .env file}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_PASSWORD:?Please configure PGADMIN_PASSWORD in the .env file}"
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: true
      PGADMIN_LISTEN_PORT: 8009
    volumes:
      - type: bind
        source: ./docker/pgadmin/servers.json
        target: /pgadmin4/servers.json
    networks:
      - mrmap-internal    
  flower:
    image: mher/flower:2.2
    command: ["celery", "--broker=redis://redis:6379", "flower", "--port=5555", "--url_prefix=flower"]
    networks:
      - mrmap-internal

volumes:
  frontend-static: null
  backend-static: null
  backend-media: null
  backend-log: null
  backend-import: null
  celery-state: null
  db-data: null
  db-data-17: null
  db-data-18: null
  mem-db-data: null
  vlogs-data: null
  grafana-data: null

networks:
  docker-status:
    internal: true
  mrmap-internal: null
