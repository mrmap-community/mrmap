# Project and organization keys are supplied by the GitHub Actions variables.
sonar.projectName=MrMap
sonar.sourceEncoding=UTF-8
sonar.sources=backend,frontend/src
sonar.tests=backend/tests,frontend/src,frontend/tests
sonar.exclusions=backend/tests/**,backend/coverage/**,**/migrations/**,**/fixtures/**,**/static/**,**/templates/**,backend/locale/**,frontend/src/**/*.spec.*,frontend/src/**/tests/**,**/*.d.ts,**/AGENTS.md
sonar.test.inclusions=backend/tests/**,frontend/src/**/*.spec.*,frontend/src/**/tests/**,frontend/tests/**
sonar.test.exclusions=**/fixtures/**

# Match the runtime and coverage scope already used by the test services.
sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.coverage.exclusions=backend/manage.py
