# Defaults for the acceptance suite, read by behave from this directory (the working directory of
# the `behave` service). Command line options always win, so CI keeps passing its own tags and path.
# Only the `@skip` tag has a meaning; run a subset with `--tags=@wms` style tags if you add more.
#
# The one option of this suite that can not be defaulted here is `--simple`, and that is not an
# oversight: it is a behave-django option that the `manage.py behave` command reads before behave
# ever opens this file, because it selects the Django test runner. Without that runner every
# scenario ends in a flush of the whole database, which deletes the rows `before_all` and
# `before_feature` seeded, so `tests/behave/environment.py` refuses such a run by name. Carry the
# flag on the command line instead -- the `behave` service of docker-compose.dev.yml, CI and every
# command of `tests/behave/AGENTS.md` do.
[behave]
paths = tests/behave/features
show_skipped = false
default_tags = -@skip
