name: Quality Assurance
on:
  workflow_dispatch:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
    types: [opened, synchronize, reopened]
  schedule:
    - cron: 0 16 * * *

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Disposable test credentials; no deployment secrets are needed, including for fork PRs.
# Compose interpolates every service, so these also cover services not started by QA.
env:
  COMPOSE_PROJECT_NAME: mrmap-ci
  EXTERNAL_BASE_URL: localhost
  EXTERNAL_PORT: 8000
  EXTERNAL_SCHEME: http
  DB_USER: mrmap
  DB_PASSWORD: mrmap-ci-password
  # Acceptance scenarios authenticate the seeded administrator as mrmap/mrmap.
  DJANGO_ADMIN_USER: mrmap
  DJANGO_ADMIN_PASSWORD: mrmap
  DJANGO_SECRET_KEY: mrmap-ci-secret-key-for-disposable-test-containers
  OPENOBSERVE_USER: admin@example.com
  OPENOBSERVE_PASSWORD: mrmap-ci-password
  PGADMIN_USER: admin@example.com
  PGADMIN_PASSWORD: mrmap-ci-password

jobs:
  pre-commit-checks:
    name: pre-commit-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run pre commit checks
        # Match checkout ownership so translation checks can write to the bind mount.
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml run --rm --build --user "$(id -u):$(id -g)" pre-commit-check

  acceptance-tests:
    name: acceptance-tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run behave tests
        # Match checkout ownership so coverage can write to the bind mount.
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml run --rm --build --user "$(id -u):$(id -g)" behave

      - name: upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-tests-coverage-report
          if-no-files-found: error
          include-hidden-files: true
          path: |
            ./backend/acceptance-tests-coverage-report.xml
            ./backend/.coverage.acceptance

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run unit tests
        # Match checkout ownership so coverage can write to the bind mount.
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml run --rm --build --user "$(id -u):$(id -g)" django-tests

      - name: upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: unit-tests-coverage-report
          if-no-files-found: error
          include-hidden-files: true
          path: |
            ./backend/unit-tests-coverage-report.xml
            ./backend/.coverage.unit

  frontend-tests:
    name: frontend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout repo
        uses: actions/checkout@v7

      - name: Install frontend dependencies
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml run --rm frontend-tests npm ci --no-audit --no-fund

      - name: Lint frontend
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml run --rm frontend-tests npm run lint

      - name: Type check frontend
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml run --rm frontend-tests npm run type-check

      - name: Run frontend tests with coverage
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml run --rm frontend-tests npm run test-coverage

      - name: Summarize frontend coverage
        if: always()
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          report = Path('frontend/coverage/coverage-summary.json')
          if report.exists():
              totals = json.loads(report.read_text())['total']
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('### Frontend coverage\n\n| Metric | Coverage |\n| --- | ---: |\n')
                  for metric in ('lines', 'statements', 'branches', 'functions'):
                      summary.write(f"| {metric} | {totals[metric]['pct']}% |\n")
          PYTHON

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          if-no-files-found: error
          path: frontend/coverage/

  backend-coverage:
    needs: [unit-tests, acceptance-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install coverage reporter
        run: python -m pip install coverage==7.6.12
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-tests-coverage-report'
          merge-multiple: true
          path: backend
      - name: Combine backend coverage
        working-directory: backend
        run: |
          python -m coverage combine .coverage.unit .coverage.acceptance
          python -m coverage xml
          python -m coverage html
          python -m coverage report --format=markdown --fail-under=75 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          if-no-files-found: error
          path: backend/coverage/

  sonarcloud:
    name: sonarcloud
    needs: [backend-coverage, frontend-tests]
    # Fork PRs and Dependabot do not receive repository secrets. Variables opt in
    # only after the public SonarCloud project and its analysis token are ready.
    if: >-
      vars.SONAR_ORGANIZATION != '' && vars.SONAR_PROJECT_KEY != '' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: backend-coverage
          path: backend/coverage
      - uses: actions/download-artifact@v8
        with:
          name: frontend-coverage
          path: frontend/coverage
      - name: Make coverage paths relative to the repository root
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          # The python coverage sensor resolves a relative <class filename> below exactly one
          # base directory and discards the entry when more than one matches, see
          # CoberturaParser.resolve of the sonar python plugin. coverage.xml announces its
          # report directory twice, so the <sources> element is dropped and the file names
          # carry the path from the repository root instead - the project base directory is
          # the only remaining base directory then.
          report = Path('backend/coverage/coverage.xml')
          tree = ET.parse(report)
          root = tree.getroot()
          sources = root.find('./sources')
          if sources is not None:
              root.remove(sources)
          for class_element in root.iter('class'):
              filename = class_element.get('filename')
              if filename and not filename.startswith('backend/'):
                  class_element.set('filename', f'backend/{filename}')
          # A report the scanner cannot read measures 0 % coverage quietly, which looks
          # exactly like new code without tests. Fail the job here instead, see #757.
          unresolvable = sorted(
              class_element.get('filename')
              for class_element in root.iter('class')
              if not Path(class_element.get('filename')).exists()
          )
          if unresolvable:
              raise SystemExit(
                  f'{len(unresolvable)} coverage entries do not exist in the checkout, '
                  f'first of them: {unresolvable[0]}'
              )
          tree.write(report, encoding='utf-8', xml_declaration=True)

          report = Path('frontend/coverage/lcov.info')
          lines = report.read_text().splitlines(keepends=True)
          report.write_text(''.join(
              f'SF:frontend/{line[3:]}' if line.startswith('SF:src/') else line
              for line in lines
          ))
          PYTHON
      - name: Analyze code and check the SonarCloud quality gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
