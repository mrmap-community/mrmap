name: Script tests

# WHERE THIS BELONGS, AND HOW TO TURN IT ON.
#
# GitHub lets neither this repository's bot token nor anyone else's personal
# token create or update a file under .github/workflows without an explicit
# "workflows" permission, so the definition lives here and a human activates it:
#
#     mkdir -p .github/workflows && cp ci/script-tests.yml .github/workflows/script-tests.yml
#
# That is the same arrangement the controller repository uses for its own CI
# (ci/ci.yml there), so the activation step is one habit, not two.
#
# WHY A SEPARATE JOB, AND WHY A BARE RUNNER.
#
# The suites in scripts/ test the repository's own tooling: the claim board and
# issue identity in scripts/wip, the host admission gate in scripts/agent_capacity
# and the human decision protocol in scripts/decisions. None of them is reached by
# the QA jobs: those run inside a container that binds only ./backend, so scripts/
# is not even present in the image that performs the linting. Four of the suites
# resolve the repository root (git rev-parse, docker/backend/alpine.Dockerfile),
# so they cannot pass in a container that sees only ./backend, and one of them
# drives real git repositories, which the python:*-alpine image base does not
# have. ubuntu-latest has git and docker, a plain checkout has the whole
# repository, and the whole set runs in well under a minute.
#
# Nothing here needs credentials, a database or a container image: the suites are
# offline by design, and where they want docker they probe for it and skip the
# affected checks out loud.

on:
  workflow_dispatch:
  push:
    branches: [master, develop]
  merge_group:
    types: [checks_requested]
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repo-tooling:
    name: scripts/ suites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          # 3.13 is what the deployment host runs the orchestration tooling with.
          python-version: '3.13'

      # Prints one line per suite with that suite's own verdict, and the output
      # of any failing one, so a red check is readable without a debug session.
      - name: Run the repository tooling suites
        run: scripts/check_repo_tooling.sh
