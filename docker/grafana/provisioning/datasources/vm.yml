apiVersion: 1
# Metrics store of the optional OpenTelemetry path (#1778, ADR-0003). Reached
# through Grafana's datasource proxy - the store publishes no host port of its
# own, so Grafana's login is the only operator access to these queries. The uid
# is stable because the dashboard of #1781 provisions against it by uid.
datasources:
  - name: VictoriaMetrics
    uid: victoriametrics
    type: victoriametrics-metrics-datasource
    access: proxy
    url: http://victoria-metrics:8428
    editable: true
