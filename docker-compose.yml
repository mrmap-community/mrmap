      # names is in that file, and one added there would silently stop working.)
      DJANGO_SECURE_SSL_REDIRECT:
      DJANGO_SECURE_HSTS_SECONDS:
      DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS:
      DJANGO_SECURE_HSTS_PRELOAD:
      DJANGO_SECURE_CONTENT_TYPE_NOSNIFF:
      DJANGO_SECURE_REFERRER_POLICY:
      DJANGO_X_FRAME_OPTIONS:
      DJANGO_COOKIE_SECURE:
      DJANGO_CORS_ALLOWED_ORIGINS:
      DJANGO_CSRF_TRUSTED_ORIGINS:
      DJANGO_CONTENT_SECURITY_POLICY:
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?Please configure DJANGO_SECRET_KEY in the .env file}"
      # the credential of the shared redis instance (#1473), which this process
      # reads for its broker, its result backend, its cache and its channel
      # layer (MrMap/settings.py); the same value the redis service starts with
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Please configure REDIS_PASSWORD in the .env file}"
      MRMAP_USER: "${DJANGO_ADMIN_USER:?Please configure DJANGO_ADMIN_USER in the .env file}"
      MRMAP_PASSWORD: "${DJANGO_ADMIN_PASSWORD:?Please configure DJANGO_ADMIN_PASSWORD in the .env file}"
      SQL_USER: "${DB_USER:?Please configure DB_PASSWORD in the .env file}"
      SQL_PASSWORD: "${DB_PASSWORD:?Please configure DB_PASSWORD in the .env file}"
    env_file:
      - ./docker/backend/.mrmap.env
    depends_on:
      postgis:
        # see backend: wait for the pg_isready healthcheck, not just the start (#901)
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,time; p=pathlib.Path('/var/mrmap/run/beat-heartbeat'); raise SystemExit(0 if p.exists() and 0 <= time.time()-p.stat().st_mtime < 30 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./
      dockerfile: ./docker/nginx/nginx.Dockerfile
      args:
        # For Production: Insert the correct schema and the correct hostname and port of the backend
        - VITE_API_BASE_URL=${EXTERNAL_BASE_URL:?Please configure EXTERNAL_BASE_URL in the .env file}
        - VITE_API_PORT=${EXTERNAL_PORT:?Please configure EXTERNAL_PORT in the .env file}
        - VITE_API_SCHEMA=${EXTERNAL_SCHEME:?Please configure EXTERNAL_SCHEME in the .env file}
        # the exact revision this bundle was built from (#1579); leave it
        # empty and the About display marks the build as a development
        # revision instead of naming a revision it cannot prove
        - MRMAP_BUILD_REVISION=${MRMAP_BUILD_REVISION:-}
    # nginx logs are symlinked to stdout/stderr, ship them into victoria-logs
    logging:
      driver: syslog
      options:
        syslog-address: "udp://127.0.0.1:5514"
        syslog-format: "rfc5424"
        syslog-facility: "local5"
        tag: "{{.Name}}"
    hostname: "nginx"
    restart: unless-stopped
    environment:
      <<: *proxy-env
    volumes:
      - type: bind
        source: ./docker/nginx/mrmap.conf
        target: /etc/nginx/conf.d/default.conf
      # Both static roots (/var/www/mrmap/frontend with the built SPA,
      # /var/www/mrmap/backend with the collectstatic output) are served from
      # this image's own content, built in by docker/nginx/nginx.Dockerfile.
      # A named volume over either path would be filled from the image only
      # while empty, so `up -d --build` after an upgrade kept serving the
      # previous version's assets from the volume - and stale hashed files
      # never disappeared, which #942's 404s and #946's immutable caching
      # both depend on. (#922) That no mount ever returns to those paths is
      # what scripts/static_mounts_smoke.py checks; #1027 is the invisible
      # stale rebuild a mount caused again on an older checkout.
    ports:
      - "${EXTERNAL_PORT:?Please configure EXTERNAL_PORT in the .env file}:80"
    depends_on:
      - backend
    networks:
      - mrmap-internal
    extra_hosts:
      - host.docker.internal:host-gateway

  # Central log store: native RFC 5424 syslog receiver, parses MrMap's
  # structured-data parameters into queryable fields. The HTTP API and the vmui
  # stay network-internal; Grafana is the only web entry point.
  victoria-logs:
    image: victoriametrics/victoria-logs:v1.54.0
    restart: unless-stopped
    hostname: "victoria-logs"
    command:
      - "-storageDataPath=/vlogs-data"
      - "-retentionPeriod=14d"
      - "-syslog.listenAddr.udp=:5514"
      - "-httpListenAddr=:9428"
    ports:
      # loopback only: docker's syslog log-driver (e.g. postgis) ships
      # container stdout/stderr host-side into this receiver
      - "127.0.0.1:5514:5514/udp"
    volumes:
      - vlogs-data:/vlogs-data
    networks:
      - mrmap-internal

  # Metrics store of the optional OpenTelemetry path (#1778, epic #1775,
  # ADR-0003): OTLP/HTTP protobuf in, MetricsQL and the Prometheus-compatible
  # query API out. Like victoria-logs it publishes no host port - the network
  # internal HTTP API is read by Grafana, which carries the login.
  #
  # `-opentelemetry.promoteResourceAttributes=` is deliberately empty: ADR-0003
  # promotes no arbitrary resource attribute, so nothing a caller controls can
  # become a metric dimension here. Retention is the ADR's starting proposal for
  # metrics; retention bounds *time*, never *bytes*, which is what the memory
  # ceiling of the lightweight tier and `-storage.minFreeDiskSpaceBytes` below
  # are for: without free space left on its volume VictoriaMetrics stops merging
  # parts rather than filling the host's disk.
  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.157.0
    restart: unless-stopped
    hostname: "victoria-metrics"
    command:
      - "-storageDataPath=/vm-data"
      - "-retentionPeriod=${VICTORIA_METRICS_RETENTION:-90d}"
      - "-httpListenAddr=:8428"
      - "-opentelemetry.usePrometheusNaming"
      - "-opentelemetry.promoteResourceAttributes="
      - "-storage.minFreeDiskSpaceBytes=${VICTORIA_METRICS_MIN_FREE_DISK:-1073741824}"
    volumes:
      - vm-data:/vm-data
    networks:
      - mrmap-internal

  # Trace store of the same path. It answers the Jaeger and the Tempo query HTTP
  # API on its own port, which is why Grafana needs no third-party plugin and no
  # Jaeger UI is deployed beside it: the built-in Tempo datasource of Grafana
  # queries http://victoria-traces:10428/select/tempo.
  #
  # VictoriaTraces is pre-1.0: a minor release may change storage or query
  # compatibility, so back up vt-data before bumping the pin and follow the
  # upgrade notes of the target release. The retention below is the ADR's
  # starting proposal for traces.
  victoria-traces:
    image: victoriametrics/victoria-traces:v0.13.0
    restart: unless-stopped
    hostname: "victoria-traces"
    command:
      - "-storageDataPath=/vt-data"
      - "-retentionPeriod=${VICTORIA_TRACES_RETENTION:-7d}"
      - "-httpListenAddr=:10428"
      - "-retention.maxDiskSpaceUsageBytes=${VICTORIA_TRACES_MAX_DISK_USAGE:-10737418240}"
    volumes:
      - vt-data:/vt-data
    networks:
      - mrmap-internal

  # Log UI with login/RBAC in front of victoria-logs (which stays network-internal)
  grafana:
    image: grafana/grafana:13.3.2
    restart: unless-stopped
    hostname: "grafana"
    environment:
      <<: *proxy-env
      GF_SERVER_ROOT_URL: "http://%(domain)s:%(http_port)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:?Please configure GRAFANA_ADMIN_USER in the .env file}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Please configure GRAFANA_ADMIN_PASSWORD in the .env file}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Every plugin this deployment needs, each with its exact version -
      # `plugin@version` is the pinning syntax of the Grafana catalog (#1778).
      # The metrics datasource of victoria-metrics is a separate plugin with its
      # own releases; the traces datasource needs none, because Grafana's Tempo
      # datasource is built in. Both VictoriaMetrics plugins are signed by their
      # vendor and not by Grafana Labs, which is the state of the upstream
      # catalog, not a local exception to signature verification.
      GF_PLUGINS_PREINSTALL: "${GRAFANA_PLUGINS_PREINSTALL:-victoriametrics-logs-datasource@0.34.0,victoriametrics-metrics-datasource@1.0.1}"
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: "${GRAFANA_PLUGINS_UNSIGNED:-victoriametrics-logs-datasource,victoriametrics-metrics-datasource}"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - mrmap-internal

  pgadmin:
    image: dpage/pgadmin4:9.19
    restart: unless-stopped
    hostname: "pgadmin"
    environment:
      # pgadmin validates its default email at startup and crash-loops on
      # addresses without a fully-qualified domain (e.g. admin@localhost, #1013);
      # an explicit PGADMIN_USER in .env still wins over this fallback.
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_USER:-admin@example.com}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_PASSWORD:?Please configure PGADMIN_PASSWORD in the .env file}"
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: true
      PGADMIN_LISTEN_PORT: 8009
    volumes:
      - type: bind
        source: ./docker/pgadmin/servers.json
        target: /pgadmin4/servers.json
    networks:
      - mrmap-internal
  flower:
    image: mher/flower:2.2
    restart: unless-stopped
    # #1473: the instance only answers an authenticated client since the
    # redis service got `--requirepass`, so the broker URL of the UI carries
    # the credential too. `$$` keeps the value out of the published service
    # config: the container's own shell expands it from the environment below,
    # which is the same variable every other client of the project reads.
    command: ["sh", "-c", "exec celery --broker=redis://:$$REDIS_PASSWORD@redis:6379 flower --port=5555 --url_prefix=flower"]
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Please configure REDIS_PASSWORD in the .env file}"
    networks:
      - mrmap-internal

volumes:
  # No frontend-static / backend-static: build artifacts do not belong in
  # volumes, the images own both static roots. See the `frontend` service.
  backend-media: null
  backend-log: null
  backend-import: null
  celery-state: null
  db-data: null
  db-data-17: null
  db-data-18: null
  mem-db-data: null
  vlogs-data: null
  # the two stores of the optional OpenTelemetry path (#1778): one volume per
  # signal, so the retention, the disk bound and the backup of a store are the
  # business of that store alone
  vm-data: null
  vt-data: null
  grafana-data: null

networks:
  docker-status:
    internal: true
  mrmap-internal: null
