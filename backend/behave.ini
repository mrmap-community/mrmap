# Defaults for the acceptance suite, read by behave from this directory (the working directory of
# the `behave` service). Command line options always win, so CI keeps passing its own tags and path.
# Only the `@skip` tag has a meaning; run a subset with `--tags=@wms` style tags if you add more.
[behave]
paths = tests/behave/features
show_skipped = false
default_tags = -@skip
