name: Branch Policy

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review

permissions:
  contents: read

jobs:
  validate-branch-policy:
    name: Validate Branch Policy
    runs-on: ubuntu-latest

    steps:
      - name: Validate source branch
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [[ "$HEAD_BRANCH" != "develop" || "$HEAD_REPO" != "$BASE_REPO" ]]; then
            echo "::error::Only develop may target master."
            exit 1
          fi

          echo "Branch policy validated."
