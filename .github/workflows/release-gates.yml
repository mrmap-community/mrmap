name: Release gates

# WHY THIS JOB EXISTS (issue #1583, epic #1577).
#
# The QA workflow answers "do the tests pass"; it does not answer "did this
# change break the public contract, silently add a migration nobody documented,
# or reopen a boundary #1180 closed". Those are the questions
# scripts/release_gates.py decides, and every one of them is a question about
# the CANDIDATE against a reviewed baseline - which is exactly the review a
# release candidate must not skip. The candidate's OpenAPI document only
# exists inside the backend image (GDAL, settings, the app registry), so the
# contract job generates it the way every other QA job runs the image, and the
# remaining gates run on the bare runner like scripts/ tooling always does:
# they read files and git, never a container.
#
# What lives where, and why this is not a third copy of QA:
#
#   api-contract  the candidate document from `manage.py spectacular` (the one
#                 generator the application already uses for /api/schema),
#                 diffed by scripts/release_gates.py api against the committed
#                 contract baseline. Today the baseline manifest is
#                 `pre-baseline` (measured: 0 tags, #1578), so the job proves
#                 the candidate is the checkout's own document and the
#                 reviewed 0.x policy is declared; the first released
#                 baseline turns it into the full diff without touching this
#                 file.
#   release-gates version and upgrade statically: bump policy and migration
#                 notes for the range, the graph leaf rule (delegated to
#                 scripts/migration_graph_smoke.py), the #1180 protected
#                 nodes, the retired app, fake and destructive migrations.
#
# The PostgreSQL runs a release still needs - a fresh install and an upgrade
# from the oldest supported baseline with representative data - are exactly
# what the QA containers already migrate through for a fresh install; the
# upgrade-from-baseline run becomes runnable the moment a released baseline
# exists, and the directive it must start from (the notify.0006 marker,
# scripts/release_upgrade_baseline.json) is what `upgrade` prints. Wiring that
# run belongs to the promotion of #1584, not to a duplicate suite here.
#
# The promotion attestation itself (`release_gates.py promote`) is deliberately
# NOT triggered here: it consumes evidence only a promotion-time workflow of
# #1584 can gather, and promotion stays a human act on a permanent branch.

on:
  workflow_dispatch:
  push:
    branches: [master, develop]
  merge_group:
    types: [checks_requested]
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Disposable test credentials, the same values quality-assurance.yml documents:
# Compose interpolates every service, so these also cover services this job
# never starts. No deployment secret appears here.
env:
  COMPOSE_PROJECT_NAME: mrmap-ci-gates
  EXTERNAL_BASE_URL: localhost
  EXTERNAL_PORT: 8000
  EXTERNAL_SCHEME: http
  DB_USER: mrmap
  DB_PASSWORD: mrmap-ci-password
  DJANGO_ADMIN_USER: mrmap
  DJANGO_ADMIN_PASSWORD: mrmap
  DJANGO_SECRET_KEY: mrmap-ci-secret-key-for-disposable-test-containers
  GRAFANA_ADMIN_USER: admin
  GRAFANA_ADMIN_PASSWORD: mrmap-ci-password
  PGADMIN_USER: admin@example.com
  PGADMIN_PASSWORD: mrmap-ci-password

jobs:
  api-contract:
    name: contract diff (OpenAPI/JSON:API)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The document is generated by the application's own generator inside
      # the backend image; the bind mount lands the file in the checkout so
      # the host-side gate - which must not run inside Django - can read it.
      # The service is started WITH its dependencies and its own entrypoint:
      # `wait_db.sh` is what makes the command run at all (it execs the
      # command only once pg_isready says the database accepts queries, and
      # exits 1 after 120 probes otherwise), so `run --no-deps` here is a 10
      # minute timeout, not an optimization - the schema build itself asks
      # the database nothing, but the image's readiness gate is the contract
      # every other QA job runs the image under, and a document generated
      # beside a live database is the faithful candidate. The generator's
      # 300+ warnings are its own graceful-fallback report; it exits 0.
      - name: Generate the candidate OpenAPI document
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml \
            run --rm --build --user "$(id -u):$(id -g)" pre-commit-check \
            python manage.py spectacular \
            --file /opt/mrmap/openapi-candidate.json --format openapi-json

      - name: Diff the candidate against the reviewed contract baseline
        run: |
          python3 scripts/release_gates.py api \
            --candidate backend/openapi-candidate.json \
            --report release-api.json

      - name: Upload the candidate and the verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-contract-report
          if-no-files-found: warn
          path: |
            backend/openapi-candidate.json
            release-api.json

  release-gates:
    name: version and upgrade gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The version gate classifies the range and the upgrade gate reads
          # the graph of (HEAD UNION develop): both need the real history, so
          # no shallow clone here - the same reason script-tests.yml stays on
          # a bare runner with the whole checkout.
          fetch-depth: 0

      - name: Bump policy and migration notes for the range
        run: |
          python3 scripts/release_gates.py version --report release-version.json

      - name: Migration graph, #1180 boundaries, fake and destructive migrations
        run: |
          python3 scripts/release_gates.py upgrade --report release-upgrade.json

      - name: Upload the gate reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-gate-reports
          if-no-files-found: warn
          path: |
            release-version.json
            release-upgrade.json
