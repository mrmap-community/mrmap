# Browser side error reports (docker/nginx/error-beacon.js) are answered here,
# without the backend involved. The report fields travel in the query string,
# so nginx has them at log time without ever reading a request body, and one
# report is one line of its own log. That log goes to stdout like access.log
# (see the symlink in nginx.Dockerfile) and ships with the container logs to
# VictoriaLogs (see the logging block of the frontend service).
#
# What a report may cost the log stack is the question the limit below answers:
# only an accepted report with a message of its own is worth a line, so an
# address writes at most its rate of lines no matter how hard it tries. A probe
# without a message, a GET and a request over the limit are answered the same
# quiet way and write nothing.
map "$status:$arg_msg" $mrmap_frontend_error_log {
    default     0;
    ~^204:.+    1;
}

# The zone bounds what one address can write: the beacon caps itself per page
# load, but the beacon is a courtesy and this is the bound.
limit_req_zone $binary_remote_addr zone=mrmap_frontend_error:1m rate=5r/s;

# The protocol this edge reports to the backend (#1473).
#
# The backend trusts exactly one thing about the protocol of a request:
# ``SECURE_PROXY_SSL_HEADER`` in backend/MrMap/settings.py reads
# ``X-Forwarded-Proto`` and treats the request as TLS only when that header
# says ``https``. That trust is worth exactly what this line is worth, so the
# value is *normalized* here instead of forwarded verbatim: this used to be
# ``proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;``, which hands
# the client-supplied header through unchanged - any client could declare its
# plain-http request to be https, and whoever chooses whether the application
# believes it is on TLS chooses the cookie flags, the HSTS answer and, with
# ``SECURE_SSL_REDIRECT`` on, whether the request is redirected at all.
#
# What survives is the value of a TLS terminator in front of this edge (it
# names the protocol it really terminated) or, when no such header arrived,
# the protocol of this connection. The empty branch is ``$scheme`` of *this*
# edge, which is http while this server listens on 80 only - so a deployment
# which terminates TLS in front has to set the header itself. That is the
# documented contract of ``EXTERNAL_SCHEME`` and the precondition of the SSL
# redirect of #1473: an edge which does not name the protocol leaves Django
# reading its own https traffic as plain http, and every request is then
# 301'd back to the https origin it arrived on.
map $http_x_forwarded_proto $mrmap_forwarded_proto {
    default     $http_x_forwarded_proto;
    ""          $scheme;
}

log_format mrmap_frontend_error escape=json
    'Frontend Error source="$arg_source" msg="$arg_msg" url="$arg_url"'
    ' page="$arg_page" stack="$arg_stack"'
    ' ua="$http_user_agent" ip="$remote_addr" answered="$status"';

# Content-Security-Policy of the edge (#1473, audit SEC-17), answered for every
# response of this server: the SPA shell, its hashed bundles, the proxied
# backend answers and nginx's own 404s. The backend answers the same policy for
# the documents it renders itself (``CONTENT_SECURITY_POLICY`` of
# backend/MrMap/settings.py, answered by MrMap/middleware.py); the two lists
# exist because the knox token lives in ``localStorage`` and the browser
# session of #835 beside it, so an injected script which has read a credential
# can only spend it if CSP still lets the page reach the network. Both sides
# name the same sources, for the same reasons:
#
#   unpkg.com                            leaflet and leaflet-geoman (index.html)
#   fonts.googleapis.com / gstatic.com    the Roboto stylesheet and its fonts
#   cdn.jsdelivr.net                      the monaco loader of the XML editor
#   *.tile.openstreetmap.org               the basemap of the record editor maps
#
# ``'unsafe-inline'`` for style is the mechanism MUI, leaflet and monaco
# position overlays and editor decorations with; no such allowance exists for
# script, which is the point of the header. ``blob:`` for images is what the
# authenticated OGC previews draw from: those are fetched through the
# same-origin ``/mrmap-proxy`` route (``'self'``) and handed to the map as an
# object URL. ``frame-ancestors 'none'`` is the framing rule; it replaces what
# the retired X-XSS-Protection pair was never able to do. ``connect-src`` stays
# ``'self'`` with no ``wss:`` of its own: the socket of the SPA is the ``/ws/``
# route of this very server, so it is same-origin by construction and needs no
# source, while a bare ``wss:`` would hand injected script an outbound channel to
# any host. The sockets of the vite dev server are the one case where a socket
# leaves its origin; they join the backend's copy outside production
# (``CSP_DEV_CONNECT_SRC`` in ``backend/MrMap/settings.py``), never this one.
server{
    listen              80;
    server_name         frontend;
    # one variable, because the policy is answered at server level *and*
    # repeated in the two locations whose add_header set does not inherit
    set $mrmap_csp "default-src 'self'; script-src 'self' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://unpkg.com https://*.tile.openstreetmap.org; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    # Framing is denied for everything this edge serves or forwards, at every
    # status: ``always`` is not decoration, because without it add_header is
    # skipped on the 404 of a location. The value matches ``X_FRAME_OPTIONS``
    # of the backend, so the two never disagree about whether a page of this
    # deployment may be framed.
    #
    # The CSP is deliberately NOT answered here. A server-level add_header is
    # inherited by the proxy locations as well, and a proxied backend answer
    # already carries the policy Django decided on and why
    # (``CONTENT_SECURITY_POLICY`` and ``MrMap/middleware.py``). A browser
    # enforces the *intersection* of every Content-Security-Policy of a
    # response, so a second copy on the same response is not a stronger policy:
    # it is one policy two files can disagree about, with the stricter side
    # winning silently and the operator debugging the wrong file. Each side
    # therefore answers the documents it renders - the backend its OGC answers
    # and error pages, this edge the SPA shell below - and no response of the
    # shipped stack carries the header twice.
    #
    # ``X-XSS-Protection "1; mode=block"`` used to sit next to this, twice. It
    # is gone on purpose (#1473): the feature is removed from every current
    # browser, its own blocker has documented bypasses, and a deployment which
    # answers CSP does not want a second, older auditor of the same documents
    # making its own decisions about them.
    add_header X-Frame-Options "DENY" always;

    charset     utf-8;
    # max upload size
    client_max_body_size 75M;  # adjust to taste

    # The app boot moves megabytes of compressible text - the OpenAPI schema
    # alone is some 5.7 MB of JSON (#946). The nginx of this image is an
    # alpine-slim build without the brotli module (verified with nginx -V),
    # so the edge ships gzip; brotli can join once the base image links it.
    # text/html is compressed unconditionally by gzip; the list covers the
    # hashed bundles and the JSON answers proxied to the backend. gzip_vary
    # keeps intermediaries from mixing the variants, gzip_proxied any lets
    # the proxied answers through despite their Cache-Control, and a 1 kB
    # floor keeps the many small jsonapi answers from paying for a wrapper.
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types
        text/plain
        text/css
        text/xml
        application/xml
        application/json
        application/vnd.api+json
        application/vnd.oai.openapi+json
        application/javascript
        application/manifest+json
        image/svg+xml;

    # Exact match on purpose: a prefix location would lose to the regex below,
    # which hands /api/ to django, and django has no such endpoint.
    location = /api/system/error {
        access_log /var/log/nginx/frontend-error.log
                   mrmap_frontend_error if=$mrmap_frontend_error_log;
        limit_req zone=mrmap_frontend_error burst=50 nodelay;
        limit_req_status 429;

        # Not `return 204`, although that is the shorter way to say it: `return`
        # answers in the rewrite phase, before the preaccess phase where
        # limit_req is consulted, so the bound above would silently never
        # apply (measured: 40 concurrent reports, every one of them 204). No
        # file of this url exists under the frontend root, so try_files answers
        # the 204 fallback one stat later and the bound holds.
        root /var/www/mrmap/frontend;
        try_files $uri =204;
    }

    # The dumps of the slow request logging are media files which carry complete sql
    # statements and internal host names, and only the syslog line points at them.
    # They are answered here, before the location which proxies media to the
    # backend, and the backend refuses the same path for every origin it serves (#888).
    location ^~ /media/logs/ {
        return 404;
    }

    # The same policy, extended to the media the deployments keep for themselves
    # (#1447): the Fernet key files of the external service authentications, the
    # request and response bodies the security proxy logged, and the metadata
    # documents a harvesting run stages. None of them has an HTTP consumer - the
    # application reads the keys through the filesystem and the log rows live in
    # the database - so the edge refuses them like the dumps above, and the
    # backend refuses the very same prefixes on its side (system.views). Rows of
    # scripts/nginx_routing_smoke.py pin all of it; preview images and stored
    # XML documents stay on the proxied media route, where the frontend links
    # point.
    location ^~ /media/ext_auth_keys/ {
        return 404;
    }
    location ^~ /media/security_proxy/logs/ {
        return 404;
    }
    location ^~ /media/temporary_md_metadata_file/ {
        return 404;
    }

    # The websockets go to a server of their own inside the backend container:
    # the HTTP of that container is served by sync workers, which cannot speak an
    # upgrade, and the ASGI server which serves /ws listens on 8002 beside it
    # (backend/.bash_scripts/startup_ws.sh, #1032).
    #
    # `^~` for the very reason the three tool proxies further down need it: left to
    # the regex phase, a url of this mount whose last segment carries an asset
    # extension is judged by the asset rule at the end of this server and answered
    # 404 instead of upgraded - the shape of #1110, and a row of
    # scripts/nginx_routing_smoke.py. With this block in place, the `ws`
    # alternative of the regex below would never be reached again, so it is gone:
    # a second rule for a mount which can never answer is a rule waiting to
    # disagree with the one which does.
    location ^~ /ws/ {
        resolver 127.0.0.11 valid=30;
        set $upstream_backend_ws backend;

        proxy_pass http://$upstream_backend_ws:8002;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # use x-forwarded headers that are added by reverse proxy in front
        # the protocol info is needed for django. Otherwise django does not know that this connection is secure or not
        # normalized, never the client's own header: see the map above (#1473)
        proxy_set_header X-Forwarded-Proto $mrmap_forwarded_proto;

        proxy_pass_request_headers on;
    }

    # The separator belongs to the match: an alternative which only has to
    # *start* with a prefix also swallows the frontend routes whose name starts
    # with one, and /csw-client begins with "csw". Proxied, Django has no such
    # route and answers its own 404, so the page could not be reloaded,
    # bookmarked or shared (#1036). Written this way, every application route
    # reaches the SPA fallback below instead.
    #
    # /csw is the one backend mount without a separator of its own: the CSW
    # endpoint is registered exactly at "csw" in backend/MrMap/urls.py, so it is
    # proxied as itself and as a subtree, while /csw-client stays with the SPA.
    #
    # /ws is not in this list anymore: it has the location of its own above, which
    # names the port its server listens on.
    #
    # And it must stay above the asset rule at the end of this server: nginx takes
    # the first regular expression which matches, so a url of a mount which ends in
    # .png or .json is settled here rather than there - a url of a mount belongs to
    # that mount, whatever its last segment ends in (#1110).
    location ~ ^/(api|csw|django-admin|mrmap-proxy|media)/|^/csw$ {
        resolver 127.0.0.11 valid=30;
        set $upstream_backend backend;

        proxy_pass http://$upstream_backend:8001;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # use x-forwarded headers that are added by reverse proxy in front
        # the protocol info is needed for django. Otherwise django does not know that this connection is secure or not
        # normalized, never the client's own header: see the map above (#1473)
        proxy_set_header X-Forwarded-Proto $mrmap_forwarded_proto;

        proxy_pass_request_headers on;
    }

    # The `^~` of these three tool proxies and of the backend's static root below
    # is what keeps them out of the reach of the asset rule at the end of this
    # server; that rule explains why it needs them. (#1110)
    # The three tool proxies below and the backend proxy above deliberately
    # carry no Content-Security-Policy of their own: what arrives from grafana,
    # pgadmin, flower or django is answered by whoever rendered it (#1473).
    location ^~ /grafana/ {  # ^~ : the asset rule must not judge this proxy's files
        resolver 127.0.0.11 valid=30;
        set $upstream_grafana grafana;

        proxy_pass http://$upstream_grafana:3000;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Grafana Live (websockets)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    location ^~ /pgadmin/ {  # ^~ : the asset rule must not judge this proxy's files
        resolver 127.0.0.11 valid=30;
        set $upstream_pgadmin pgadmin;

        proxy_pass http://$upstream_pgadmin:8009;
        proxy_redirect off;

        proxy_set_header X-Script-Name /pgadmin;
        proxy_set_header X-Scheme $http_x_forwarded_proto;
        proxy_set_header Host $http_host;

    }

    location ^~ /flower/ {  # ^~ : the asset rule must not judge this proxy's files
        resolver 127.0.0.11 valid=30;
        set $upstream_flower flower;

        proxy_pass http://$upstream_flower:5555;
        proxy_redirect off;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location ^~ /backend/static/ {  # ^~ : the asset rule must not judge these files
        alias /var/www/mrmap/backend/;
    }

    # The beacon's own file gets an exact location of its own, independent of
    # how index.html references it (nginx.Dockerfile injects it root-absolute;
    # a relative reference would resolve below the route path and must never be
    # answered with the app shell): a missing beacon answers as a real 404
    # instead of falling through to the SPA fallback below. (#942)
    location = /error-beacon.js {
        root /var/www/mrmap/frontend;
        try_files $uri =404;
    }

    # vite's hashed bundles live under /assets/ and their names change with
    # every build, so a URL under /assets/ that hits no file is a stale or
    # wrong URL - serving the app shell for it turns a deploy mistake into an
    # unparseable module ("MIME type text/html") and teaches caches a lie.
    # A miss answers 404 here.
    #
    # The cache policy the suggested fix of #942 deferred to #946 is the rest
    # of this block: vite fingerprints the content of every built file into
    # its name, so a name under /assets/ that exists always carries the same
    # bytes - the definition of immutable. One year is the honest upper bound
    # that churn draws from the filenames themselves; index.html below stays
    # no-cache, so a new deploy is picked up with its new asset names on the
    # next load, never from stale content.
    location ^~ /assets/ {
        root /var/www/mrmap/frontend;
        try_files $uri =404;

        # add_header does not inherit: declaring one here drops the
        # server-level headers, so all of them are repeated.
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy $mrmap_csp always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html is the one answer of this server that must never be trusted
    # from cache without asking: it names the hashed assets of the current
    # deploy. no-cache revalidates it on every load (nginx answers that
    # against its Last-Modified/ETag with a 304); the immutable /assets/
    # above stays safe only while this holds.
    location = /index.html {
        root /var/www/mrmap/frontend;

        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy $mrmap_csp always;
        add_header Cache-Control "no-cache";
    }

    location / {
        root /var/www/mrmap/frontend;
        index index.html;

        # A url which carries a static file extension is answered by the asset
        # rule at the end of this server, not by the fallback below: a missing
        # file of this root stays a 404 and never becomes the app shell. (#942)

        # Application routes: nothing on disk for this url -> boot the SPA.
        # The fallback stays a redirect URI instead of a plain file parameter:
        # as a file parameter nginx would serve index.html from *this*
        # location, and the exact location's `Cache-Control: no-cache` would
        # cover only direct /index.html requests, not route deep links.
        # Without index.html on disk the redirect ends in a 404 either way.
        try_files $uri $uri/ /index.html;
        # add_header does not inherit, so the framing answer of the server is
        # repeated here - and this is the location which renders the document
        # the policy exists for: the SPA shell, into which an injected script
        # would otherwise read the knox token out of localStorage and ride the
        # browser session of #835 with it (#1473)
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy $mrmap_csp always;
    }

    # The asset rule of #942: whatever carries a static file extension and hits no
    # file is a stale or wrong url, and answering it with the app shell turns a
    # deploy mistake into an unparseable module ("MIME type text/html") and teaches
    # caches a lie. A miss therefore answers 404 here. It covers the paths vite and
    # index.html can request from outside /assets/ (favicon, manifest, images, the
    # beacon through a relative link on a deep route).
    #
    # Where it sits is the part not to move carelessly. While it was nested inside
    # `location /` it was judged *deeper* than the proxy regex of this server: for
    # a url below a backend mount the deepest matched prefix location still is
    # `location /`, and nginx consults that location's own regex set before the one
    # of the server. So it judged /media/<upload>.png - the url ProtectedServeView
    # exists to answer, and the name of every stored preview_image - and answered
    # nginx's own 404 instead of the file (#1110). Written after the proxy regex,
    # it is reached only for urls that regex did not already settle, and a proxied
    # url of any mount is proxied.
    #
    # The other half of the same caution is the `^~` of the four locations above
    # (the three tool proxies and the backend's static root): nginx consults the
    # regex set of a server after the longest prefix match, so a plain prefix lets
    # this rule win over those locations for their *own* asset-shaped urls
    # (/grafana/public/build/..., /backend/static/admin/css/base.css) - measured,
    # and precisely why #942 kept the rule nested. The `^~` is what lets it live at
    # this level instead, and the rows of scripts/nginx_routing_smoke.py hold both
    # halves in place. An exact `=` location needs nothing of the sort: it is taken
    # before the regex phase, which is how /error-beacon.js is served by its own
    # location and answers a real 404 once it is gone (#942).
    location ~* \.(?:js|mjs|css|map|json|ico|png|jpe?g|gif|svg|webp|woff2?)$ {
        root /var/www/mrmap/frontend;
        try_files $uri =404;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}