# Browser side error reports (docker/nginx/error-beacon.js) are answered here,
# without the backend involved. The report fields travel in the query string,
# so nginx has them at log time without ever reading a request body, and one
# report is one line of its own log. That log goes to stdout like access.log
# (see the symlink in nginx.Dockerfile) and ships with the container logs to
# VictoriaLogs (see the logging block of the frontend service).
#
# What a report may cost the log stack is the question the limit below answers:
# only an accepted report with a message of its own is worth a line, so an
# address writes at most its rate of lines no matter how hard it tries. A probe
# without a message, a GET and a request over the limit are answered the same
# quiet way and write nothing.
map "$status:$arg_msg" $mrmap_frontend_error_log {
    default     0;
    ~^204:.+    1;
}

# The zone bounds what one address can write: the beacon caps itself per page
# load, but the beacon is a courtesy and this is the bound.
limit_req_zone $binary_remote_addr zone=mrmap_frontend_error:1m rate=5r/s;

log_format mrmap_frontend_error escape=json
    'Frontend Error source="$arg_source" msg="$arg_msg" url="$arg_url"'
    ' page="$arg_page" stack="$arg_stack"'
    ' ua="$http_user_agent" ip="$remote_addr" answered="$status"';

server{
    listen              80;
    server_name         frontend;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";

    charset     utf-8;
    # max upload size
    client_max_body_size 75M;  # adjust to taste

    # The app boot moves megabytes of compressible text - the OpenAPI schema
    # alone is some 5.7 MB of JSON (#946). The nginx of this image is an
    # alpine-slim build without the brotli module (verified with nginx -V),
    # so the edge ships gzip; brotli can join once the base image links it.
    # text/html is compressed unconditionally by gzip; the list covers the
    # hashed bundles and the JSON answers proxied to the backend. gzip_vary
    # keeps intermediaries from mixing the variants, gzip_proxied any lets
    # the proxied answers through despite their Cache-Control, and a 1 kB
    # floor keeps the many small jsonapi answers from paying for a wrapper.
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types
        text/plain
        text/css
        text/xml
        application/xml
        application/json
        application/vnd.api+json
        application/vnd.oai.openapi+json
        application/javascript
        application/manifest+json
        image/svg+xml;

    # Exact match on purpose: a prefix location would lose to the regex below,
    # which hands /api/ to django, and django has no such endpoint.
    location = /api/system/error {
        access_log /var/log/nginx/frontend-error.log
                   mrmap_frontend_error if=$mrmap_frontend_error_log;
        limit_req zone=mrmap_frontend_error burst=50 nodelay;
        limit_req_status 429;

        # Not `return 204`, although that is the shorter way to say it: `return`
        # answers in the rewrite phase, before the preaccess phase where
        # limit_req is consulted, so the bound above would silently never
        # apply (measured: 40 concurrent reports, every one of them 204). No
        # file of this url exists under the frontend root, so try_files answers
        # the 204 fallback one stat later and the bound holds.
        root /var/www/mrmap/frontend;
        try_files $uri =204;
    }

    # The dumps of the slow request logging are media files which carry complete sql
    # statements and internal host names, and only the syslog line points at them.
    # They are answered here, before the location which proxies media to the
    # backend, and the backend refuses the same path for every origin it serves (#888).
    location ^~ /media/logs/ {
        return 404;
    }

    location ~ ^/(api|csw|ws|django-admin|mrmap-proxy|media/) {
        resolver 127.0.0.11 valid=30;
        set $upstream_backend backend;

        proxy_pass http://$upstream_backend:8001;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # use x-forwarded headers that are added by reverse proxy in front
        # the protocol info is needed for django. Otherwise django does not know that this connection is secure or not
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_pass_request_headers on;
    }

    location /grafana/ {
        resolver 127.0.0.11 valid=30;
        set $upstream_grafana grafana;

        proxy_pass http://$upstream_grafana:3000;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Grafana Live (websockets)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    location /pgadmin/ {
        resolver 127.0.0.11 valid=30;
        set $upstream_pgadmin pgadmin;

        proxy_pass http://$upstream_pgadmin:8009;
        proxy_redirect off;

        proxy_set_header X-Script-Name /pgadmin;
        proxy_set_header X-Scheme $http_x_forwarded_proto;
        proxy_set_header Host $http_host;

    }

    location /flower/ {
        resolver 127.0.0.11 valid=30;
        set $upstream_flower flower;

        proxy_pass http://$upstream_flower:5555;
        proxy_redirect off;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /backend/static/ {
        alias /var/www/mrmap/backend/;
    }

    # The beacon's own file gets an exact location of its own, independent of
    # how index.html references it (nginx.Dockerfile injects it root-absolute;
    # a relative reference would resolve below the route path and must never be
    # answered with the app shell): a missing beacon answers as a real 404
    # instead of falling through to the SPA fallback below. (#942)
    location = /error-beacon.js {
        root /var/www/mrmap/frontend;
        try_files $uri =404;
    }

    # vite's hashed bundles live under /assets/ and their names change with
    # every build, so a URL under /assets/ that hits no file is a stale or
    # wrong URL - serving the app shell for it turns a deploy mistake into an
    # unparseable module ("MIME type text/html") and teaches caches a lie.
    # A miss answers 404 here.
    #
    # The cache policy the suggested fix of #942 deferred to #946 is the rest
    # of this block: vite fingerprints the content of every built file into
    # its name, so a name under /assets/ that exists always carries the same
    # bytes - the definition of immutable. One year is the honest upper bound
    # that churn draws from the filenames themselves; index.html below stays
    # no-cache, so a new deploy is picked up with its new asset names on the
    # next load, never from stale content.
    location ^~ /assets/ {
        root /var/www/mrmap/frontend;
        try_files $uri =404;

        # add_header does not inherit: declaring one here drops the
        # server-level pair, so it is repeated.
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html is the one answer of this server that must never be trusted
    # from cache without asking: it names the hashed assets of the current
    # deploy. no-cache revalidates it on every load (nginx answers that
    # against its Last-Modified/ETag with a 304); the immutable /assets/
    # above stays safe only while this holds.
    location = /index.html {
        root /var/www/mrmap/frontend;

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header Cache-Control "no-cache";
    }

    location / {
        root /var/www/mrmap/frontend;
        index index.html;

        # The same rule as above for the asset paths vite and index.html can
        # request from outside /assets/ (favicon, manifest, images, the beacon
        # through a relative link on a deep route): whatever carries a static
        # file extension and hits no file answers 404, never the app shell.
        # Nested inside `location /` on purpose: as a regex of this server it
        # would win over the plain-prefix proxies above for their own static
        # files (/grafana/..., /backend/static/...) and break them; nested, it
        # only ever judges requests that were already going to fall through to
        # the SPA fallback. (#942)
        location ~* \.(?:js|mjs|css|map|json|ico|png|jpe?g|gif|svg|webp|woff2?)$ {
            try_files $uri =404;
        }

        # Application routes: nothing on disk for this url -> boot the SPA.
        # The fallback stays a redirect URI instead of a plain file parameter:
        # as a file parameter nginx would serve index.html from *this*
        # location, and the exact location's `Cache-Control: no-cache` would
        # cover only direct /index.html requests, not route deep links.
        # Without index.html on disk the redirect ends in a 404 either way.
        try_files $uri $uri/ /index.html;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}