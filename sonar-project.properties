# Project and organization keys are supplied by the GitHub Actions variables.
sonar.projectName=MrMap
sonar.sourceEncoding=UTF-8
sonar.sources=backend,frontend/src
sonar.tests=backend/tests,frontend/src,frontend/tests
sonar.exclusions=backend/tests/**,backend/coverage/**,**/migrations/**,**/fixtures/**,**/static/**,**/templates/**,backend/locale/**,frontend/src/**/*.spec.*,frontend/src/**/tests/**,**/*.d.ts,**/AGENTS.md,docker/inspire-validator/**
sonar.test.inclusions=backend/tests/**,frontend/src/**/*.spec.*,frontend/src/**/tests/**,frontend/tests/**
sonar.test.exclusions=**/fixtures/**

# Exclude test suites and colocated specs from duplication metrics.
# The frontend translation catalogs are the same case: en.ts and de.ts mirror
# each other's keys by design, so every block added to one structurally
# duplicates the block added to the other (725 such lines are already measured
# on master). The values differ per language and both files must change
# together, which is the point of the catalogs, not duplicated logic.
sonar.cpd.exclusions=**/tests/**,**/__tests__/**,**/*.spec.*,**/*.test.*,frontend/src/i18n/**

# Match the runtime and coverage scope already used by the test services.
sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.coverage.exclusions=backend/manage.py
